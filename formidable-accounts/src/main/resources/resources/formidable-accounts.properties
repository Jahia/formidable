# Formidable Accounts - labels of the editor and sentences the visitor reads.
# Resource bundle of the module (resources.formidable-accounts); ASCII only, accents as \\uXXXX escapes.

fmdbacc_createAccountAction=Create account
fmdbacc_createAccountAction.ui.tooltip=Creates the account of the visitor who submits the form: user name from the e-mail, password hashed by Jahia, optional group, optional sign-in, optional e-mail activation. The form must have the CAPTCHA option, and a password field (Input Password). Do not put a Save to JCR or Email Form Content action on the same form to keep the password: those actions never receive it.
fmdbacc_createAccountAction.emailField=E-mail field
fmdbacc_createAccountAction.emailField.ui.tooltip=The field that holds the visitor's e-mail address. It is also the user name of the account.
fmdbacc_createAccountAction.passwordField=Password field
fmdbacc_createAccountAction.passwordField.ui.tooltip=The password field of the form (Input Password). A plain text field is refused: the password would be stored and e-mailed like any other answer.
fmdbacc_createAccountAction.firstNameField=First name field
fmdbacc_createAccountAction.firstNameField.ui.tooltip=Optional. The field whose value becomes the first name of the account.
fmdbacc_createAccountAction.lastNameField=Last name field
fmdbacc_createAccountAction.lastNameField.ui.tooltip=Optional. The field whose value becomes the last name of the account.
fmdbacc_createAccountAction.group=Group
fmdbacc_createAccountAction.group.ui.tooltip=Optional. The group the new account joins, among the groups your administrator allowed (<i>allowedGroups</i> in the module's configuration): a global group, or one of this site's. A group that gives back-office access is refused when a visitor signs up. Empty list: ask the administrator.
fmdbacc_createAccountAction.signIn=Sign the visitor in
fmdbacc_createAccountAction.signIn.ui.tooltip=Signs the visitor in as soon as the account is created, through Jahia's own login. Ignored when e-mail activation is required: the visitor signs in after activating.
fmdbacc_createAccountAction.redirectPage=Page to go to afterwards
fmdbacc_createAccountAction.redirectPage.ui.tooltip=The page the visitor is sent to once the account is created. A page of the site, published.
fmdbacc_createAccountAction.redirectParameter=Return parameter
fmdbacc_createAccountAction.redirectParameter.ui.tooltip=Optional. The name of a parameter of the form's page address that says where the visitor was going, for example <i>redirect</i> for <i>/sign-up?redirect=/members</i>. Used when the visitor is signed in, ahead of the page above, and only if it is a path of this site.
fmdbacc_createAccountAction.passwordPattern=Password rule
fmdbacc_createAccountAction.passwordPattern.ui.tooltip=Optional regular expression the whole password must match. Empty: at least one digit, one lower-case letter, one upper-case letter and one symbol, 8 to 64 characters.
fmdbacc_createAccountAction.activationRequired=Require e-mail activation
fmdbacc_createAccountAction.activationRequired.ui.tooltip=The account is created locked and the visitor receives a link by e-mail; it becomes usable when the link is followed. Needs Jahia's mail service to be configured. Off by default.
fmdbacc_createAccountAction.activationHours=Link validity (hours)
fmdbacc_createAccountAction.activationHours.ui.tooltip=How long the activation link works. 48 by default, 720 at most.
fmdbacc_createAccountAction.activationPage=Page after activation
fmdbacc_createAccountAction.activationPage.ui.tooltip=The page the visitor lands on once the link is followed (for example a page with the sign-in form). It receives <i>fmdbActivation=done</i>. Empty: a short confirmation page.
fmdbacc_createAccountAction.activationSubject=Activation e-mail subject
fmdbacc_createAccountAction.activationSubject.ui.tooltip=Optional. Empty: the module's own subject, in the visitor's language.
fmdbacc_createAccountAction.activationMessage=Activation e-mail message
fmdbacc_createAccountAction.activationMessage.ui.tooltip=Optional. <b>${link}</b> is replaced by the activation link and <b>${hours}</b> by its validity. Empty: the module's own message, in the visitor's language.
fmdbacc_createAccountAction.pendingMessage=Message while awaiting activation
fmdbacc_createAccountAction.pendingMessage.ui.tooltip=Optional. Shown instead of the form's submission message when the account awaits its activation e-mail. Empty: the module's own message.

fmdbacc_signInAction=Sign in
fmdbacc_signInAction.ui.tooltip=Signs the visitor in through Jahia's own login. The form must have the CAPTCHA option, and a password field (Input Password). A failure always reads the same, whether the account exists or not.
fmdbacc_signInAction.loginField=E-mail or user name field
fmdbacc_signInAction.loginField.ui.tooltip=The field where the visitor types the e-mail address or the user name.
fmdbacc_signInAction.passwordField=Password field
fmdbacc_signInAction.passwordField.ui.tooltip=The password field of the form (Input Password). A plain text field is refused.
fmdbacc_signInAction.redirectPage=Page to go to afterwards
fmdbacc_signInAction.redirectPage.ui.tooltip=The page the visitor is sent to once signed in. A page of the site, published.
fmdbacc_signInAction.redirectParameter=Return parameter
fmdbacc_signInAction.redirectParameter.ui.tooltip=Optional. The name of a parameter of the form's page address that says where the visitor was going, for example <i>redirect</i> for <i>/login?redirect=/members</i>. Used ahead of the page above, and only if it is a path of this site.
fmdbacc_signInAction.failureMessage=Message when the sign-in fails
fmdbacc_signInAction.failureMessage.ui.tooltip=Optional. Shown when the e-mail or the password is wrong. Keep it the same for both. Empty: the module's own message, in the visitor's language.

# What the visitor reads (never says which accounts exist)
visitor.genericFailure=We could not complete your request. Check your details and try again.
visitor.invalidEmail=Enter a valid e-mail address.
visitor.passwordPolicy=The password does not meet the requirements.
visitor.tooManyAttempts=Too many attempts. Please try again later.
visitor.signInFailed=Wrong e-mail or password.
visitor.accountNotActive=Your account is not active yet. Check your mailbox for the activation e-mail.
visitor.unavailable=This form is temporarily unavailable. Please try again later.
visitor.checkMailbox=Thank you. We sent you an e-mail: follow its link to activate your account.
mail.activationSubject=Activate your account
mail.activationBody=Hello,\n\nFollow this link to activate your account:\n\n${link}\n\nThe link expires in ${hours} hours. If you did not ask for an account, ignore this message.
verify.done=Your account is active. You can now sign in.
verify.invalid=This activation link is not valid or has expired.
