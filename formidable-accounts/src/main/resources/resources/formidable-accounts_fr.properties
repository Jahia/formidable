# Formidable Accounts - libell\u00e9s de l'\u00e9diteur et phrases lues par le visiteur.

fmdbacc_createAccountAction=Cr\u00e9er un compte
fmdbacc_createAccountAction.ui.tooltip=Cr\u00e9e le compte du visiteur qui envoie le formulaire : identifiant tir\u00e9 de l'e-mail, mot de passe hach\u00e9 par Jahia, groupe optionnel, connexion optionnelle, activation par e-mail optionnelle. Le formulaire doit avoir l'option CAPTCHA et un champ mot de passe (Saisie de mot de passe). N'ajoutez pas sur le m\u00eame formulaire une action Sauvegarde JCR ou E-mail du contenu du formulaire pour conserver le mot de passe : ces actions ne le re\u00e7oivent jamais.
fmdbacc_createAccountAction.emailField=Champ e-mail
fmdbacc_createAccountAction.emailField.ui.tooltip=Le champ qui contient l'adresse e-mail du visiteur. C'est aussi l'identifiant du compte.
fmdbacc_createAccountAction.passwordField=Champ mot de passe
fmdbacc_createAccountAction.passwordField.ui.tooltip=Le champ mot de passe du formulaire (Saisie de mot de passe). Un champ texte ordinaire est refus\u00e9 : le mot de passe serait enregistr\u00e9 et envoy\u00e9 par e-mail comme n'importe quelle r\u00e9ponse.
fmdbacc_createAccountAction.firstNameField=Champ pr\u00e9nom
fmdbacc_createAccountAction.firstNameField.ui.tooltip=Optionnel. Le champ dont la valeur devient le pr\u00e9nom du compte.
fmdbacc_createAccountAction.lastNameField=Champ nom
fmdbacc_createAccountAction.lastNameField.ui.tooltip=Optionnel. Le champ dont la valeur devient le nom du compte.
fmdbacc_createAccountAction.group=Groupe
fmdbacc_createAccountAction.group.ui.tooltip=Optionnel. Le groupe que rejoint le nouveau compte, parmi les groupes autoris\u00e9s par votre administrateur (<i>allowedGroups</i> dans la configuration du module) : un groupe global, ou un groupe de ce site. Un groupe qui donne acc\u00e8s au back-office est refus\u00e9 \u00e0 l'inscription. Liste vide : demandez \u00e0 l'administrateur.
fmdbacc_createAccountAction.signIn=Connecter le visiteur
fmdbacc_createAccountAction.signIn.ui.tooltip=Connecte le visiteur d\u00e8s que le compte est cr\u00e9\u00e9, par la connexion native de Jahia. Ignor\u00e9 quand l'activation par e-mail est requise : le visiteur se connecte apr\u00e8s l'avoir activ\u00e9.
fmdbacc_createAccountAction.redirectPage=Page de destination
fmdbacc_createAccountAction.redirectPage.ui.tooltip=La page vers laquelle le visiteur est envoy\u00e9 une fois le compte cr\u00e9\u00e9. Une page du site, publi\u00e9e.
fmdbacc_createAccountAction.redirectParameter=Param\u00e8tre de retour
fmdbacc_createAccountAction.redirectParameter.ui.tooltip=Optionnel. Le nom d'un param\u00e8tre de l'adresse de la page du formulaire qui dit o\u00f9 allait le visiteur, par exemple <i>redirect</i> pour <i>/inscription?redirect=/membres</i>. Utilis\u00e9 quand le visiteur est connect\u00e9, avant la page ci-dessus, et seulement si c'est un chemin de ce site.
fmdbacc_createAccountAction.passwordPattern=R\u00e8gle du mot de passe
fmdbacc_createAccountAction.passwordPattern.ui.tooltip=Optionnel. Expression r\u00e9guli\u00e8re que le mot de passe entier doit v\u00e9rifier. Vide : au moins un chiffre, une minuscule, une majuscule et un symbole, de 8 \u00e0 64 caract\u00e8res.
fmdbacc_createAccountAction.activationRequired=Exiger l'activation par e-mail
fmdbacc_createAccountAction.activationRequired.ui.tooltip=Le compte est cr\u00e9\u00e9 verrouill\u00e9 et le visiteur re\u00e7oit un lien par e-mail ; il devient utilisable quand le lien est suivi. Demande que le service de messagerie de Jahia soit configur\u00e9. D\u00e9sactiv\u00e9 par d\u00e9faut.
fmdbacc_createAccountAction.activationHours=Validit\u00e9 du lien (heures)
fmdbacc_createAccountAction.activationHours.ui.tooltip=Dur\u00e9e pendant laquelle le lien d'activation fonctionne. 48 par d\u00e9faut, 720 au maximum.
fmdbacc_createAccountAction.activationPage=Page apr\u00e8s activation
fmdbacc_createAccountAction.activationPage.ui.tooltip=La page o\u00f9 arrive le visiteur une fois le lien suivi (par exemple une page avec le formulaire de connexion). Elle re\u00e7oit <i>fmdbActivation=done</i>. Vide : une courte page de confirmation.
fmdbacc_createAccountAction.activationSubject=Objet de l'e-mail d'activation
fmdbacc_createAccountAction.activationSubject.ui.tooltip=Optionnel. Vide : l'objet du module, dans la langue du visiteur.
fmdbacc_createAccountAction.activationMessage=Message de l'e-mail d'activation
fmdbacc_createAccountAction.activationMessage.ui.tooltip=Optionnel. <b>${link}</b> est remplac\u00e9 par le lien d'activation et <b>${hours}</b> par sa validit\u00e9. Vide : le message du module, dans la langue du visiteur.
fmdbacc_createAccountAction.pendingMessage=Message en attente d'activation
fmdbacc_createAccountAction.pendingMessage.ui.tooltip=Optionnel. Affich\u00e9 \u00e0 la place du message d'envoi du formulaire quand le compte attend son e-mail d'activation. Vide : le message du module.

fmdbacc_signInAction=Se connecter
fmdbacc_signInAction.ui.tooltip=Connecte le visiteur par la connexion native de Jahia. Le formulaire doit avoir l'option CAPTCHA et un champ mot de passe (Saisie de mot de passe). Un \u00e9chec se lit toujours de la m\u00eame fa\u00e7on, que le compte existe ou non.
fmdbacc_signInAction.loginField=Champ e-mail ou identifiant
fmdbacc_signInAction.loginField.ui.tooltip=Le champ o\u00f9 le visiteur saisit son adresse e-mail ou son identifiant.
fmdbacc_signInAction.passwordField=Champ mot de passe
fmdbacc_signInAction.passwordField.ui.tooltip=Le champ mot de passe du formulaire (Saisie de mot de passe). Un champ texte ordinaire est refus\u00e9.
fmdbacc_signInAction.redirectPage=Page de destination
fmdbacc_signInAction.redirectPage.ui.tooltip=La page vers laquelle le visiteur est envoy\u00e9 une fois connect\u00e9. Une page du site, publi\u00e9e.
fmdbacc_signInAction.redirectParameter=Param\u00e8tre de retour
fmdbacc_signInAction.redirectParameter.ui.tooltip=Optionnel. Le nom d'un param\u00e8tre de l'adresse de la page du formulaire qui dit o\u00f9 allait le visiteur, par exemple <i>redirect</i> pour <i>/connexion?redirect=/membres</i>. Utilis\u00e9 avant la page ci-dessus, et seulement si c'est un chemin de ce site.
fmdbacc_signInAction.failureMessage=Message en cas d'\u00e9chec
fmdbacc_signInAction.failureMessage.ui.tooltip=Optionnel. Affich\u00e9 quand l'e-mail ou le mot de passe est faux. Gardez-le identique pour les deux. Vide : le message du module, dans la langue du visiteur.

# Ce que lit le visiteur (ne dit jamais quels comptes existent)
visitor.genericFailure=Nous n'avons pas pu traiter votre demande. V\u00e9rifiez vos informations et r\u00e9essayez.
visitor.invalidEmail=Saisissez une adresse e-mail valide.
visitor.passwordPolicy=Le mot de passe ne respecte pas les exigences.
visitor.tooManyAttempts=Trop de tentatives. Veuillez r\u00e9essayer plus tard.
visitor.signInFailed=E-mail ou mot de passe incorrect.
visitor.accountNotActive=Votre compte n'est pas encore actif. Consultez votre bo\u00eete mail : un e-mail d'activation vous a \u00e9t\u00e9 envoy\u00e9.
visitor.unavailable=Ce formulaire est momentan\u00e9ment indisponible. Veuillez r\u00e9essayer plus tard.
visitor.checkMailbox=Merci. Nous vous avons envoy\u00e9 un e-mail : suivez son lien pour activer votre compte.
mail.activationSubject=Activez votre compte
mail.activationBody=Bonjour,\n\nSuivez ce lien pour activer votre compte :\n\n${link}\n\nLe lien expire dans ${hours} heures. Si vous n'avez pas demand\u00e9 de compte, ignorez ce message.
verify.done=Votre compte est actif. Vous pouvez maintenant vous connecter.
verify.invalid=Ce lien d'activation n'est pas valide ou a expir\u00e9.
