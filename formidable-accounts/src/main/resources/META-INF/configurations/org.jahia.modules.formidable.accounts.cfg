# default configuration - deployed once, then kept as edited.
# Formidable Accounts (PID org.jahia.modules.formidable.accounts): the abuse protection of the Create account and Sign in
# actions. Jahia copies this file to digital-factory-data/karaf/etc the first time the module starts without it there,
# and the line above tells Jahia never to overwrite that copy: edit it, your changes are kept. Every value below is the
# built-in default.
#
# Both actions refuse to run (a generic message for the visitor, an error in the log) on a form without the CAPTCHA
# option. Set this to false on a local development instance only: a public sign-up or sign-in form without a CAPTCHA
# is an open door for bots.
requireCaptcha=true
# Attempts are counted in memory, per JVM: a restart, or another node of a cluster, starts from zero.
# Per remote address, whatever the outcome (request.getRemoteAddr(): behind a proxy, configure the container so that
# it is the visitor's address, or every visitor shares the proxy's limit).
maxAttemptsPerAddress=20
addressWindowSeconds=600
# Per account (the e-mail or user name typed, whether or not it exists): every sign-up attempt, every failed sign-in.
maxAttemptsPerAccount=5
accountWindowSeconds=900
# Upper bound on the addresses and accounts remembered at once.
maxTrackedKeys=10000
# Groups, separated by semicolons, that a form can never add a visitor to.
deniedGroups=administrators;privileged;site-administrators;site-privileged;guest;users
# Scheme and host of the activation link, for example https://www.example.com. Empty: the host the request reached.
publicBaseUrl=
# From address of the activation e-mail. Empty: the sender of Jahia's mail settings.
mailFrom=
