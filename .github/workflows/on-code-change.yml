# This workflow is triggered every time a change is pushed to any branches
# Github actions command reference: https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
name: On Code Change (PR)

# The workflow could also be triggered on PRs
on:
  pull_request:
    types: [ opened, reopened, synchronize ]

jobs:
  update-signature:
    name: Update module signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jahia/jahia-modules-action/update-signature@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          nexus_enterprise_releases_url: ${{ secrets.NEXUS_ENTERPRISE_RELEASES_URL }}

  static-analysis:
    name: Static Analysis (linting, vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Jahia/jahia-modules-action/static-analysis@v2
        with:
          node_version: 22
          auditci_level: critical
      # The Cypress specs are type-checked here rather than after a forty-minute integration run (#280).
      - uses: jdx/mise-action@v4
      - name: Type-check the Cypress suite
        working-directory: tests
        run: |
          yarn install --immutable
          yarn typecheck
      # The tarball yarn would publish must import under Node ESM through its exports map, with its
      # types: scripts/smoke.mjs packs it, unpacks it and imports it by name (#308).
      - name: Smoke-import the packed @jahia/formidable-library
        run: |
          yarn install --immutable
          yarn workspace @jahia/formidable-library build
          yarn workspace @jahia/formidable-library smoke
      # The package was renamed before its first publish (#321): a reference to the old name points at
      # a package that never exists on the registry, and nothing type-checks a Markdown file. The gate
      # reads the tracked files (yarn.lock included) and skips only this workflow, whose pattern would
      # match itself.
      - name: No reference to the pre-rename package name
        run: |
          if git grep -I -n -E '@jahia/formidable([^-[:alnum:]_]|$)' -- . ':!.github/workflows/on-code-change.yml'; then
            echo "::error::the npm package is @jahia/formidable-library"; exit 1
          fi
      - name: Check the documentation links
        run: node scripts/check-doc-links.mjs

  build:
    name: Build Module
    needs: update-signature
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-noble-mvn-loaded
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: jahia/jahia-modules-action/build@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          module_id: formidable

  sonar-analysis:
    name: Sonar Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jahia/jahia-modules-action/sonar-analysis@v2
        with:
          primary_release_branch: main
          github_pr_id: ${{github.event.number}}
          sonar_url: ${{ secrets.SONAR_URL }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  integration-tests:
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    needs: build
    secrets: inherit
    with:
      jahia_image: ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT
      module_id: formidable
      should_skip_testrail: true
      pagerduty_skip_notification: true
      provisioning_manifest: provisioning-manifest-build.yml
      artifact_prefix: fmb
      module_branch: ${{ github.ref }}
