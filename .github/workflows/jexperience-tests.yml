# The jExperience specs (tests/cypress/e2e/jexperience/) on a runner of their own: a Jahia beside a jCustomer and its
# Elasticsearch (tests/docker-compose.jexperience.yml), which the shards of on-code-change.yml do not start.
# On a pull request, the tests run only when the PR changes a file that the prefill or the conditional logic reads, or
# a file of this runner. The workflow always starts, and the job is skipped otherwise: a required check whose workflow
# never starts stays pending forever.
name: jExperience Integration Tests

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
  workflow_dispatch:

jobs:
  changes:
    name: Changes the jExperience behaviour
    runs-on: ubuntu-latest
    outputs:
      jexperience: ${{ steps.filter.outputs.jexperience }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "jexperience=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths='^(formidable-jexperience-engine/'
          paths+='|formidable-elements/src/utils/(conditionalLogic|screens)\.ts$'
          paths+='|formidable-elements/src/components/Form/'
          paths+='|formidable-elements/src/hooks/(useMultiStep|useScreens|useFormSubmission)\.ts$'
          paths+='|tests/cypress/e2e/jexperience/'
          paths+='|tests/(docker-compose\.jexperience\.yml|provisioning-manifest-jexperience\.yml|cypress\.shard-jexperience\.config\.ts|ci\.startup\.sh)$'
          paths+='|\.github/workflows/jexperience-tests\.yml$)'
          if git diff --name-only "$BASE...$HEAD" | grep -E "$paths"; then
            echo "jexperience=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file of the jExperience behaviour changed: the tests are skipped."
            echo "jexperience=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Module
    needs: changes
    if: needs.changes.outputs.jexperience == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jahia/jahia-docker-mvn-cache:11-jdk-noble-mvn-loaded
      credentials:
        username: ${{ secrets.GH_PACKAGES_USERNAME }}
        password: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: jahia/jahia-modules-action/build@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          module_id: formidable

  integration-tests:
    name: Integration Tests (jexperience)
    needs: build
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    secrets: inherit
    with:
      jahia_image: ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT
      jcustomer_image: jahia/jcustomer:3
      jcustomer_cluster_enabled: false
      elasticsearch_image: ghcr.io/jahia/elasticsearch:9
      docker_compose_file: docker-compose.jexperience.yml
      module_id: formidable
      should_skip_testrail: true
      pagerduty_skip_notification: true
      provisioning_manifest: provisioning-manifest-jexperience.yml
      tests_profile: cypress.shard-jexperience.config.ts
      artifact_prefix: fmb-jexperience
      test_report_name: Tests Report (jexperience)
      module_branch: ${{ github.ref }}
