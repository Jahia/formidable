fmdbquar_remoteStubCheck=Remote check (test stub)
fmdbquar_remoteStubCheck.ui.tooltip=A stub of a check that asks a remote service. It reads its outcome from a marker in the file, for the test suite. Never use it in production.
fmdbquar_remoteStubCheck.onInconclusive=If the check is inconclusive
fmdbquar_remoteStubCheck.onInconclusive.ui.tooltip=When the check cannot decide on a file: a manager reviews the submission, or the submission is rejected. A file is never released on an inconclusive answer.
fmdbquar_remoteStubCheck.onInconclusive.review=Send to review
fmdbquar_remoteStubCheck.onInconclusive.reject=Reject the submission
fmdbquar_remoteStubCheck.onUnavailable=If the check is unavailable
fmdbquar_remoteStubCheck.onUnavailable.ui.tooltip=When the service behind the check does not answer: try again later, until the attempts are exhausted, or reject the submission.
fmdbquar_remoteStubCheck.onUnavailable.retry=Try again later
fmdbquar_remoteStubCheck.onUnavailable.reject=Reject the submission
fmdbquar_inProcessStubCheck=In-process check (test stub)
