fmdbquar_inProcessStubCheck.onUnavailable=If the check is unavailable
fmdbquar_inProcessStubCheck.onUnavailable.ui.tooltip=When the service behind the check does not answer: try again later, until the attempts are exhausted, or reject the submission.
