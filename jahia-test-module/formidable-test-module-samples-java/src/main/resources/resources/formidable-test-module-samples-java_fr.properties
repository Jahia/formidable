fmdbsample_emailDeliverabilityAction=V\u00e9rification du domaine de l'adresse
fmdbsample_emailDeliverabilityAction.ui.tooltip=Refuse une adresse dont le domaine n'existe pas \u2014 le plus souvent une faute de frappe.<br/>Ne demande ni compte ni configuration. Ne prouve pas que la bo\u00eete existe, ni m\u00eame que le domaine accepte le courrier : seul le service d'un prestataire le peut.
