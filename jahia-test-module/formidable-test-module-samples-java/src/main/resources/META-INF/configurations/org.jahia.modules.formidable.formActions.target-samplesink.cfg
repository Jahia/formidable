# default configuration - deployed once, then kept as edited.
# The forward target of the test suite: the samples module's own receiver (ForwardSinkServlet), which records the
# names of the parts a forward action sent, for a spec to read back. A development target - plain HTTP on localhost -
# honoured only while enableDevForwardTargets=true in org.jahia.modules.formidable.formActions.cfg (false by default),
# so this file changes nothing on an instance that has not switched the development targets on.
id=samplesink
label=Samples forward sink
url=http://localhost:8080/modules/formidable-samples/forward-sink
development=true
