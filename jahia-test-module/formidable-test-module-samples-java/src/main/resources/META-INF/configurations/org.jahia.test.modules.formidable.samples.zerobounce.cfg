# default configuration - deployed once, then kept as edited.
# The samples' ZeroBounce mailbox check: where it calls and the account's key. The samples point it at their own
# double of the service (ZeroBounceStubServlet, plain HTTP on this instance, hence development=true). A project
# that copies the action gives its module a file like this one, with its own PID, and the real service:
#   url=https://api.zerobounce.net
#   credential=<your ZeroBounce API key>
#   development=false
url=http://localhost:8080/modules/formidable-samples/zerobounce-stub
credential=stub-token
development=true
