# default configuration - deployed once, then kept as edited.
# The samples' Experian mailbox check: where it calls and the account's token. The samples point it at their own
# double of the service (ExperianStubServlet, plain HTTP on this instance, hence development=true). A project that
# copies the action gives its module a file like this one, with its own PID, and the real service:
#   url=https://api.experianaperture.io
#   credential=<your Experian token>
#   development=false
url=http://localhost:8080/modules/formidable-samples/experian-stub
credential=stub-token
development=true
