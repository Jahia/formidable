# default configuration - deployed once, then kept as edited.
# The samples module's forward target: a receiver running on the developer's machine, port 3000, reached from the
# Jahia container. A development target - plain HTTP on localhost or host.docker.internal - honoured only while
# enableDevForwardTargets=true in org.jahia.modules.formidable.formActions.cfg (false by default), so this file
# changes nothing on an instance that has not switched the development targets on.
id=localhost
label=Localhost
url=http://host.docker.internal:3000
development=true
