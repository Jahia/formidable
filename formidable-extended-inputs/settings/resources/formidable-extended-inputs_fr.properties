fmdbext_rating=Champ note
fmdbext_rating.ui.tooltip=Un champ de notation affiché comme une rangée d'icônes (étoiles, cœurs, pouces) ou de pastilles numérotées.<br/><b>Note :</b> <i>La valeur soumise est un nombre entre 1 et le maximum</i>.
fmdbext_rating.helpText=Aide à la saisie
fmdbext_rating.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_rating.icon=Icône
fmdbext_rating.icon.ui.tooltip=Style visuel des éléments de notation.<br/><b>Utilisation :</b> <i>Étoiles, cœurs ou pouces pour une notation graphique, nombres pour une rangée numérique compacte</i>.
fmdbext_rating.icon.star=Étoiles
fmdbext_rating.icon.heart=Cœurs
fmdbext_rating.icon.thumb=Pouces
fmdbext_rating.icon.number=Nombres
fmdbext_rating.maxValue=Valeur maximale
fmdbext_rating.maxValue.ui.tooltip=L'échelle de notation va de 1 à cette valeur.<br/><b>Validation :</b> Doit être comprise entre 2 et 10 ; les valeurs hors plage sont ramenées dans la plage au rendu.<br/><b>Exemple :</b> <i>5 pour une notation classique à cinq étoiles</i>.
fmdbext_rating.minLabel=Libellé du minimum
fmdbext_rating.minLabel.ui.tooltip=Libellé facultatif affiché sous la note la plus basse.<br/><b>Exemple :</b> <i>« Médiocre »</i>.
fmdbext_rating.maxLabel=Libellé du maximum
fmdbext_rating.maxLabel.ui.tooltip=Libellé facultatif affiché sous la note la plus haute.<br/><b>Exemple :</b> <i>« Excellent »</i>.
fmdbext_rating.required=Obligatoire
fmdbext_rating.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi si aucune note n'est sélectionnée.

fmdbext_scale=Champ echelle
fmdbext_scale.ui.tooltip=Une question à échelle linéaire affichée comme une rangée de pastilles cliquables (un bouton radio par valeur), pas un curseur.<br/><b>Utilisation :</b> <i>Utilisez la vue « Scale - Net Promoter Score (0-10) » pour la question standard « recommanderiez-vous... ? », avec les valeurs verrouillées de 0 à 10</i>.<br/><b>Note :</b> <i>La valeur soumise est un nombre</i>.
fmdbext_scale.helpText=Aide à la saisie
fmdbext_scale.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_scale.minValue=Valeur minimale
fmdbext_scale.minValue.ui.tooltip=Première valeur de l'échelle.<br/><b>Note :</b> <i>Ignorée par la vue NPS, qui utilise toujours 0</i>.
fmdbext_scale.maxValue=Valeur maximale
fmdbext_scale.maxValue.ui.tooltip=Dernière valeur de l'échelle.<br/><b>Note :</b> <i>Doit être atteignable depuis le minimum avec le pas ; ignorée par la vue NPS, qui utilise toujours 10</i>.
fmdbext_scale.step=Pas
fmdbext_scale.step.ui.tooltip=Incrément entre deux valeurs consécutives.<br/><b>Utilisation :</b> <i>1 pour toutes les valeurs, 2 pour une valeur sur deux</i>.<br/><b>Note :</b> <i>Ignoré par la vue NPS, qui utilise toujours 1</i>.
fmdbext_scale.minLabel=Libellé du minimum
fmdbext_scale.minLabel.ui.tooltip=Libellé facultatif affiché sous la valeur la plus basse.<br/><b>Exemple :</b> <i>« Pas du tout probable »</i>.
fmdbext_scale.maxLabel=Libellé du maximum
fmdbext_scale.maxLabel.ui.tooltip=Libellé facultatif affiché sous la valeur la plus haute.<br/><b>Exemple :</b> <i>« Extrêmement probable »</i>.
fmdbext_scale.required=Obligatoire
fmdbext_scale.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi si aucune valeur n'est sélectionnée.

fmdbext_switch=Champ interrupteur
fmdbext_switch.ui.tooltip=Une question booléenne oui/non.<br/><b>Note :</b> <i>La valeur soumise est true ou false ; les libellés d'état sont purement visuels</i>.
fmdbext_switch.helpText=Aide à la saisie
fmdbext_switch.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_switch.displayMode=Affichage
fmdbext_switch.displayMode.ui.tooltip=Rendu du champ.<br/><b>Interrupteur :</b> un bouton marche/arrêt unique ; si obligatoire, il doit être activé pour envoyer.<br/><b>Boutons :</b> deux boutons (ex. Oui / Non) ; si obligatoire, l'un des deux doit être choisi.<br/><b>Utilisation :</b> <i>Interrupteur pour les confirmations, Boutons pour de vraies questions oui/non</i>.
fmdbext_switch.displayMode.toggle=Interrupteur
fmdbext_switch.displayMode.buttons=Boutons
fmdbext_switch.onLabel=Libellé de l'état actif
fmdbext_switch.onLabel.ui.tooltip=Libellé de l'état positif.<br/><b>Exemple :</b> <i>« Oui », « Activé », « D'accord »</i>.<br/><b>Note :</b> <i>Purement visuel : la valeur soumise est toujours true</i>.
fmdbext_switch.offLabel=Libellé de l'état inactif
fmdbext_switch.offLabel.ui.tooltip=Libellé de l'état négatif.<br/><b>Exemple :</b> <i>« Non », « Désactivé », « Pas d'accord »</i>.<br/><b>Note :</b> <i>Purement visuel : la valeur soumise est toujours false</i>.
fmdbext_switch.defaultState=Coché par défaut
fmdbext_switch.defaultState.ui.tooltip=État initial du champ à l'affichage du formulaire.<br/><b>Note :</b> <i>En mode boutons, seul le bouton actif peut être présélectionné ; sinon le champ démarre sans réponse pour que « Obligatoire » garde son sens</i>.
fmdbext_switch.required=Obligatoire
fmdbext_switch.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Mode interrupteur :</b> l'interrupteur doit être activé pour envoyer.<br/><b>Mode boutons :</b> l'une des deux options doit être sélectionnée.
fmdbext_switch.defaultOnLabel=Oui
fmdbext_switch.defaultOffLabel=Non

fmdbext_consent=Champ consentement
fmdbext_consent.ui.tooltip=Une case de consentement explicite (CGU / RGPD).<br/><b>Note :</b> <i>La valeur stockée est simplement « true » ; la page ou le document lié doit être accessible aux visiteurs anonymes</i>.
fmdbext_consent.helpText=Aide à la saisie
fmdbext_consent.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_consent.statement=Texte de consentement
fmdbext_consent.statement.ui.tooltip=Le texte de consentement affiché à côté de la case.<br/><b>Exemple :</b> <i>« J'accepte le traitement de mes données personnelles... »</i>.
fmdbext_consent.termsTarget=Page ou document des conditions
fmdbext_consent.termsTarget.ui.tooltip=Lien facultatif vers les conditions complètes (une page ou un document déposé).<br/><b>Note :</b> <i>Il doit être accessible aux visiteurs anonymes (permission invité), sinon le lien n'est pas affiché pour les utilisateurs non connectés</i>.
fmdbext_consent.termsLinkLabel=Libellé du lien
fmdbext_consent.termsLinkLabel.ui.tooltip=Libellé du lien vers les conditions complètes.<br/><b>Si vide, valeur par défaut : Lire les conditions complètes</b>.
fmdbext_consent.required=Obligatoire
fmdbext_consent.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> La case doit être cochée pour envoyer le formulaire.<br/><b>Note :</b> <i>Activé par défaut</i>.

fmdbext_card=Champ cartes
fmdbext_card.ui.tooltip=Une question à choix unique dont les options sont affichées comme des cartes cliquables.<br/><b>Note :</b> <i>La valeur soumise est la valeur de l'option choisie</i>.
fmdbext_card.helpText=Aide à la saisie
fmdbext_card.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_card.required=Obligatoire
fmdbext_card.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi si aucune carte n'est sélectionnée.

fmdbext_phone=Champ téléphone
fmdbext_phone.ui.tooltip=Un champ de numéro de téléphone : les appareils mobiles affichent le clavier téléphonique, et le navigateur peut proposer le numéro enregistré du visiteur.<br/><b>Note :</b> <i>La valeur soumise est le numéro tel que le visiteur l'a saisi</i>.
fmdbext_phone.helpText=Aide à la saisie
fmdbext_phone.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_phone.placeholder=Texte indicatif
fmdbext_phone.placeholder.ui.tooltip=Texte affiché dans le champ téléphone lorsqu'il est vide.<br/><b>Exemple :</b> <i>+33 6 12 34 56 78</i>.
fmdbext_phone.defaultValue=Valeur par défaut
fmdbext_phone.defaultValue.ui.tooltip=Valeur préremplie affichée au premier rendu du champ.<br/><b>Utilisation :</b> <i>Un indicatif pays tel que +41, que le visiteur complète</i>.
fmdbext_phone.pattern=Motif téléphone
fmdbext_phone.pattern.ui.tooltip=Expression régulière que le numéro doit respecter, vérifiée par le navigateur et par le serveur.<br/><b>Par défaut :</b> <i>Un + initial facultatif, puis des chiffres, espaces, points, tirets et parenthèses, avec 6 à 15 chiffres</i>.<br/><b>Exemple :</b> <i>[+]41[0-9 ]{9,12} pour n'accepter que les numéros suisses au format international</i>.<br/><b>Note :</b> <i>Videz-le pour accepter n'importe quelle valeur</i>.
fmdbext_phone.autocomplete=Autocomplétion
fmdbext_phone.autocomplete.ui.tooltip=Remplissage automatique du navigateur pour ce champ téléphone.<br/><b>Utilisation :</b><br/>- <b>tel</b> : <i>Propose le numéro de téléphone complet du visiteur (par défaut)</i><br/>- <b>off</b> : <i>Désactive l'autocomplétion</i><br/>- <b>Valeur libre</b> : <i>N'importe quel token HTML5 autocomplete (ex : 'tel-national', 'mobile tel', 'work tel')</i>.
fmdbext_phone.minLength=Longueur minimale
fmdbext_phone.minLength.ui.tooltip=Nombre minimum de caractères de ce champ téléphone, séparateurs compris.<br/><b>Validation :</b> Empêche l'envoi avec une valeur plus courte.
fmdbext_phone.maxLength=Longueur maximale
fmdbext_phone.maxLength.ui.tooltip=Nombre maximum de caractères autorisés dans ce champ téléphone, séparateurs compris.<br/><b>Validation :</b> Empêche la saisie au-delà de la limite.
fmdbext_phone.required=Obligatoire
fmdbext_phone.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire.<br/><b>Validation :</b> Empêche l'envoi si le champ est vide.
