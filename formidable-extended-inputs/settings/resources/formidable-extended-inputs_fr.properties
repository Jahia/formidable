fmdbext_rating=Champ Note
fmdbext_rating.ui.tooltip=Un champ de notation affiché comme une rangée d'icônes (étoiles, cœurs, pouces) ou de pastilles numérotées. La valeur soumise est un nombre entre 1 et le maximum.
fmdbext_rating.helpText=Aide à la saisie
fmdbext_rating.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_rating.icon=Icône
fmdbext_rating.icon.ui.tooltip=Style visuel des éléments de notation.
fmdbext_rating.icon.star=Étoiles
fmdbext_rating.icon.heart=Cœurs
fmdbext_rating.icon.thumb=Pouces
fmdbext_rating.icon.number=Nombres
fmdbext_rating.maxValue=Valeur maximale
fmdbext_rating.maxValue.ui.tooltip=L'échelle de notation va de 1 à cette valeur (entre 2 et 10).
fmdbext_rating.minLabel=Libellé du minimum
fmdbext_rating.minLabel.ui.tooltip=Libellé facultatif affiché sous la note la plus basse (ex. « Médiocre »).
fmdbext_rating.maxLabel=Libellé du maximum
fmdbext_rating.maxLabel.ui.tooltip=Libellé facultatif affiché sous la note la plus haute (ex. « Excellent »).
fmdbext_rating.required=Obligatoire
fmdbext_rating.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire : une note doit être sélectionnée.

fmdbext_scale=Champ Échelle
fmdbext_scale.ui.tooltip=Une échelle linéaire affichée comme une rangée de pastilles numérotées. La valeur soumise est un nombre. Utilisez la vue « Scale - NPS (0-10) » pour une question Net Promoter Score standard.
fmdbext_scale.helpText=Aide à la saisie
fmdbext_scale.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_scale.minValue=Valeur minimale
fmdbext_scale.minValue.ui.tooltip=Première valeur de l'échelle (ignorée par la vue NPS, qui utilise toujours 0).
fmdbext_scale.maxValue=Valeur maximale
fmdbext_scale.maxValue.ui.tooltip=Dernière valeur de l'échelle (ignorée par la vue NPS, qui utilise toujours 10).
fmdbext_scale.step=Pas
fmdbext_scale.step.ui.tooltip=Incrément entre deux valeurs (ignoré par la vue NPS, qui utilise toujours 1).
fmdbext_scale.minLabel=Libellé du minimum
fmdbext_scale.minLabel.ui.tooltip=Libellé facultatif affiché sous la valeur la plus basse (ex. « Pas du tout probable »).
fmdbext_scale.maxLabel=Libellé du maximum
fmdbext_scale.maxLabel.ui.tooltip=Libellé facultatif affiché sous la valeur la plus haute (ex. « Extrêmement probable »).
fmdbext_scale.required=Obligatoire
fmdbext_scale.required.ui.tooltip=Rend ce champ obligatoire pour l'envoi du formulaire : une valeur doit être sélectionnée.

fmdbext_switch=Champ Interrupteur
fmdbext_switch.ui.tooltip=Une question booléenne oui/non. La valeur soumise est true ou false ; les libellés d'état sont purement visuels.
fmdbext_switch.helpText=Aide à la saisie
fmdbext_switch.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_switch.displayMode=Affichage
fmdbext_switch.displayMode.ui.tooltip=<b>Interrupteur :</b> un bouton marche/arrêt unique ; si obligatoire, il doit être activé pour envoyer - à utiliser pour les confirmations.<br/><b>Boutons :</b> deux boutons (ex. Oui / Non) ; si obligatoire, l'un des deux doit être choisi - à utiliser pour de vraies questions oui/non.
fmdbext_switch.displayMode.toggle=Interrupteur
fmdbext_switch.displayMode.buttons=Boutons
fmdbext_switch.onLabel=Libellé de l'état actif
fmdbext_switch.onLabel.ui.tooltip=Libellé de l'état positif (ex. « Oui », « Activé », « D'accord »).
fmdbext_switch.offLabel=Libellé de l'état inactif
fmdbext_switch.offLabel.ui.tooltip=Libellé de l'état négatif (ex. « Non », « Désactivé », « Pas d'accord »).
fmdbext_switch.defaultState=Coché par défaut
fmdbext_switch.defaultState.ui.tooltip=État initial du champ à l'affichage du formulaire.
fmdbext_switch.required=Obligatoire
fmdbext_switch.required.ui.tooltip=<b>Mode interrupteur :</b> l'interrupteur doit être activé pour envoyer.<br/><b>Mode boutons :</b> l'une des deux options doit être sélectionnée.
fmdbext_switch.defaultOnLabel=Oui
fmdbext_switch.defaultOffLabel=Non

fmdbext_consent=Champ Consentement
fmdbext_consent.ui.tooltip=Une case de consentement explicite (CGU / RGPD). La valeur stockée est simplement « true ».<br/><b>Important :</b> la page ou le document lié doit être accessible aux visiteurs anonymes.
fmdbext_consent.helpText=Aide à la saisie
fmdbext_consent.helpText.ui.tooltip=Message affiché sous le libellé du champ pour aider l'utilisateur à le remplir.<br/><b>Accessibilité :</b> <i>Annoncé par les lecteurs d'écran via aria-describedby</i>.
fmdbext_consent.statement=Texte de consentement
fmdbext_consent.statement.ui.tooltip=Le texte de consentement affiché à côté de la case (ex. « J'accepte le traitement de mes données personnelles... »).
fmdbext_consent.termsTarget=Page ou document des conditions
fmdbext_consent.termsTarget.ui.tooltip=Lien facultatif vers les conditions complètes (une page ou un document déposé).<br/><b>Important :</b> il doit être accessible aux visiteurs anonymes (permission invité), sinon le lien échouera pour les utilisateurs non connectés.
fmdbext_consent.termsLinkLabel=Libellé du lien
fmdbext_consent.termsLinkLabel.ui.tooltip=Libellé du lien vers les conditions complètes. Par défaut : « Lire les conditions complètes ».
fmdbext_consent.required=Obligatoire
fmdbext_consent.required.ui.tooltip=Si activé (par défaut), la case doit être cochée pour envoyer le formulaire.
