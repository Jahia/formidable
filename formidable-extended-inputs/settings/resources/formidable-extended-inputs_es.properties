fmdbext_rating=Campo Valoración
fmdbext_rating.ui.tooltip=Un campo de valoración mostrado como una fila de iconos (estrellas, corazones, pulgares) o fichas numeradas. El valor enviado es un número entre 1 y el máximo.
fmdbext_rating.helpText=Ayuda de entrada
fmdbext_rating.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_rating.icon=Icono
fmdbext_rating.icon.ui.tooltip=Estilo visual de los elementos de valoración.
fmdbext_rating.icon.star=Estrellas
fmdbext_rating.icon.heart=Corazones
fmdbext_rating.icon.thumb=Pulgares
fmdbext_rating.icon.number=Números
fmdbext_rating.maxValue=Valor máximo
fmdbext_rating.maxValue.ui.tooltip=La escala de valoración va de 1 a este valor (entre 2 y 10).
fmdbext_rating.minLabel=Etiqueta del mínimo
fmdbext_rating.minLabel.ui.tooltip=Etiqueta opcional mostrada bajo la valoración más baja (p. ej. «Malo»).
fmdbext_rating.maxLabel=Etiqueta del máximo
fmdbext_rating.maxLabel.ui.tooltip=Etiqueta opcional mostrada bajo la valoración más alta (p. ej. «Excelente»).
fmdbext_rating.required=Obligatorio
fmdbext_rating.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario: debe seleccionarse una valoración.

fmdbext_scale=Campo Escala
fmdbext_scale.ui.tooltip=Una escala lineal mostrada como una fila de fichas numeradas. El valor enviado es un número. Use la vista «Scale - NPS (0-10)» para una pregunta Net Promoter Score estándar.
fmdbext_scale.helpText=Ayuda de entrada
fmdbext_scale.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_scale.minValue=Valor mínimo
fmdbext_scale.minValue.ui.tooltip=Primer valor de la escala (ignorado por la vista NPS, que siempre usa 0).
fmdbext_scale.maxValue=Valor máximo
fmdbext_scale.maxValue.ui.tooltip=Último valor de la escala (ignorado por la vista NPS, que siempre usa 10).
fmdbext_scale.step=Incremento
fmdbext_scale.step.ui.tooltip=Incremento entre dos valores (ignorado por la vista NPS, que siempre usa 1).
fmdbext_scale.minLabel=Etiqueta del mínimo
fmdbext_scale.minLabel.ui.tooltip=Etiqueta opcional mostrada bajo el valor más bajo (p. ej. «Nada probable»).
fmdbext_scale.maxLabel=Etiqueta del máximo
fmdbext_scale.maxLabel.ui.tooltip=Etiqueta opcional mostrada bajo el valor más alto (p. ej. «Extremadamente probable»).
fmdbext_scale.required=Obligatorio
fmdbext_scale.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario: debe seleccionarse un valor.

fmdbext_switch=Campo Interruptor
fmdbext_switch.ui.tooltip=Una pregunta booleana sí/no. El valor enviado es true o false; las etiquetas de estado son solo visuales.
fmdbext_switch.helpText=Ayuda de entrada
fmdbext_switch.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_switch.displayMode=Presentación
fmdbext_switch.displayMode.ui.tooltip=<b>Interruptor:</b> un único conmutador on/off; si es obligatorio, debe estar activado para enviar - úselo para confirmaciones.<br/><b>Botones:</b> dos botones (p. ej. Sí / No); si es obligatorio, debe elegirse uno - úselo para verdaderas preguntas sí/no.
fmdbext_switch.displayMode.toggle=Interruptor
fmdbext_switch.displayMode.buttons=Botones
fmdbext_switch.onLabel=Etiqueta del estado activo
fmdbext_switch.onLabel.ui.tooltip=Etiqueta del estado positivo (p. ej. «Sí», «Activado», «De acuerdo»).
fmdbext_switch.offLabel=Etiqueta del estado inactivo
fmdbext_switch.offLabel.ui.tooltip=Etiqueta del estado negativo (p. ej. «No», «Desactivado», «En desacuerdo»).
fmdbext_switch.defaultState=Marcado por defecto
fmdbext_switch.defaultState.ui.tooltip=Estado inicial del campo al mostrar el formulario.
fmdbext_switch.required=Obligatorio
fmdbext_switch.required.ui.tooltip=<b>Modo interruptor:</b> el conmutador debe estar activado para enviar.<br/><b>Modo botones:</b> debe seleccionarse una de las dos opciones.
fmdbext_switch.defaultOnLabel=Sí
fmdbext_switch.defaultOffLabel=No

fmdbext_consent=Campo Consentimiento
fmdbext_consent.ui.tooltip=Una casilla de consentimiento explícito (condiciones / RGPD). El valor almacenado es simplemente «true».<br/><b>Importante:</b> la página o el documento enlazado debe ser legible por los visitantes anónimos.
fmdbext_consent.helpText=Ayuda de entrada
fmdbext_consent.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_consent.statement=Texto de consentimiento
fmdbext_consent.statement.ui.tooltip=El texto de consentimiento mostrado junto a la casilla (p. ej. «Acepto el tratamiento de mis datos personales...»).
fmdbext_consent.termsTarget=Página o documento de las condiciones
fmdbext_consent.termsTarget.ui.tooltip=Enlace opcional a las condiciones completas (una página o un documento subido).<br/><b>Importante:</b> debe ser legible por los visitantes anónimos (permiso de invitado); de lo contrario, el enlace fallará para los usuarios no autenticados.
fmdbext_consent.termsLinkLabel=Etiqueta del enlace
fmdbext_consent.termsLinkLabel.ui.tooltip=Etiqueta del enlace a las condiciones completas.
fmdbext_consent.required=Obligatorio
fmdbext_consent.required.ui.tooltip=Si está activado (por defecto), la casilla debe marcarse para enviar el formulario.
