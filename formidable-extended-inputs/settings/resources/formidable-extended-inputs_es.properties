fmdbext_rating=Campo Valoración
fmdbext_rating.ui.tooltip=Un campo de valoración mostrado como una fila de iconos (estrellas, corazones, pulgares) o fichas numeradas.<br/><b>Nota:</b> <i>El valor enviado es un número entre 1 y el máximo</i>.
fmdbext_rating.helpText=Ayuda de entrada
fmdbext_rating.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_rating.icon=Icono
fmdbext_rating.icon.ui.tooltip=Estilo visual de los elementos de valoración.<br/><b>Uso:</b> <i>Estrellas, corazones o pulgares para una valoración gráfica, números para una fila numérica compacta</i>.
fmdbext_rating.icon.star=Estrellas
fmdbext_rating.icon.heart=Corazones
fmdbext_rating.icon.thumb=Pulgares
fmdbext_rating.icon.number=Números
fmdbext_rating.maxValue=Valor máximo
fmdbext_rating.maxValue.ui.tooltip=La escala de valoración va de 1 a este valor.<br/><b>Validación:</b> Debe estar entre 2 y 10; los valores fuera de rango se ajustan al renderizar.<br/><b>Ejemplo:</b> <i>5 para una clásica valoración de cinco estrellas</i>.
fmdbext_rating.minLabel=Etiqueta del mínimo
fmdbext_rating.minLabel.ui.tooltip=Etiqueta opcional mostrada bajo la valoración más baja.<br/><b>Ejemplo:</b> <i>«Malo»</i>.
fmdbext_rating.maxLabel=Etiqueta del máximo
fmdbext_rating.maxLabel.ui.tooltip=Etiqueta opcional mostrada bajo la valoración más alta.<br/><b>Ejemplo:</b> <i>«Excelente»</i>.
fmdbext_rating.required=Obligatorio
fmdbext_rating.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío si no se ha seleccionado ninguna valoración.

fmdbext_scale=Campo Escala
fmdbext_scale.ui.tooltip=Una pregunta de escala lineal mostrada como una fila de fichas clicables (un botón de radio por valor), no un control deslizante.<br/><b>Uso:</b> <i>Use la vista «Scale - Net Promoter Score (0-10)» para la pregunta estándar «¿recomendaría...?», con los valores fijados de 0 a 10</i>.<br/><b>Nota:</b> <i>El valor enviado es un número</i>.
fmdbext_scale.helpText=Ayuda de entrada
fmdbext_scale.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_scale.minValue=Valor mínimo
fmdbext_scale.minValue.ui.tooltip=Primer valor de la escala.<br/><b>Nota:</b> <i>Ignorado por la vista NPS, que siempre usa 0</i>.
fmdbext_scale.maxValue=Valor máximo
fmdbext_scale.maxValue.ui.tooltip=Último valor de la escala.<br/><b>Nota:</b> <i>Debe ser alcanzable desde el mínimo con el incremento; ignorado por la vista NPS, que siempre usa 10</i>.
fmdbext_scale.step=Incremento
fmdbext_scale.step.ui.tooltip=Incremento entre dos valores consecutivos.<br/><b>Uso:</b> <i>1 para todos los valores, 2 para uno de cada dos</i>.<br/><b>Nota:</b> <i>Ignorado por la vista NPS, que siempre usa 1</i>.
fmdbext_scale.minLabel=Etiqueta del mínimo
fmdbext_scale.minLabel.ui.tooltip=Etiqueta opcional mostrada bajo el valor más bajo.<br/><b>Ejemplo:</b> <i>«Nada probable»</i>.
fmdbext_scale.maxLabel=Etiqueta del máximo
fmdbext_scale.maxLabel.ui.tooltip=Etiqueta opcional mostrada bajo el valor más alto.<br/><b>Ejemplo:</b> <i>«Extremadamente probable»</i>.
fmdbext_scale.required=Obligatorio
fmdbext_scale.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío si no se ha seleccionado ningún valor.

fmdbext_switch=Campo Interruptor
fmdbext_switch.ui.tooltip=Una pregunta booleana sí/no.<br/><b>Nota:</b> <i>El valor enviado es true o false; las etiquetas de estado son solo visuales</i>.
fmdbext_switch.helpText=Ayuda de entrada
fmdbext_switch.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_switch.displayMode=Presentación
fmdbext_switch.displayMode.ui.tooltip=Presentación del campo.<br/><b>Interruptor:</b> un único conmutador on/off; si es obligatorio, debe estar activado para enviar.<br/><b>Botones:</b> dos botones (p. ej. Sí / No); si es obligatorio, debe elegirse uno.<br/><b>Uso:</b> <i>Interruptor para confirmaciones, Botones para verdaderas preguntas sí/no</i>.
fmdbext_switch.displayMode.toggle=Interruptor
fmdbext_switch.displayMode.buttons=Botones
fmdbext_switch.onLabel=Etiqueta del estado activo
fmdbext_switch.onLabel.ui.tooltip=Etiqueta del estado positivo.<br/><b>Ejemplo:</b> <i>«Sí», «Activado», «De acuerdo»</i>.<br/><b>Nota:</b> <i>Solo visual: el valor enviado es siempre true</i>.
fmdbext_switch.offLabel=Etiqueta del estado inactivo
fmdbext_switch.offLabel.ui.tooltip=Etiqueta del estado negativo.<br/><b>Ejemplo:</b> <i>«No», «Desactivado», «En desacuerdo»</i>.<br/><b>Nota:</b> <i>Solo visual: el valor enviado es siempre false</i>.
fmdbext_switch.defaultState=Marcado por defecto
fmdbext_switch.defaultState.ui.tooltip=Estado inicial del campo al mostrar el formulario.<br/><b>Nota:</b> <i>En modo botones solo puede preseleccionarse el botón activo; de lo contrario el campo empieza sin respuesta para que «Obligatorio» conserve su sentido</i>.
fmdbext_switch.required=Obligatorio
fmdbext_switch.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Modo interruptor:</b> el conmutador debe estar activado para enviar.<br/><b>Modo botones:</b> debe seleccionarse una de las dos opciones.
fmdbext_switch.defaultOnLabel=Sí
fmdbext_switch.defaultOffLabel=No

fmdbext_consent=Campo Consentimiento
fmdbext_consent.ui.tooltip=Una casilla de consentimiento explícito (condiciones / RGPD).<br/><b>Nota:</b> <i>El valor almacenado es simplemente «true»; la página o el documento enlazado debe ser legible por los visitantes anónimos</i>.
fmdbext_consent.helpText=Ayuda de entrada
fmdbext_consent.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_consent.statement=Texto de consentimiento
fmdbext_consent.statement.ui.tooltip=El texto de consentimiento mostrado junto a la casilla.<br/><b>Ejemplo:</b> <i>«Acepto el tratamiento de mis datos personales...»</i>.
fmdbext_consent.termsTarget=Página o documento de las condiciones
fmdbext_consent.termsTarget.ui.tooltip=Enlace opcional a las condiciones completas (una página o un documento subido).<br/><b>Nota:</b> <i>Debe ser legible por los visitantes anónimos (permiso de invitado); de lo contrario, el enlace no se muestra a los usuarios no autenticados</i>.
fmdbext_consent.termsLinkLabel=Etiqueta del enlace
fmdbext_consent.termsLinkLabel.ui.tooltip=Etiqueta del enlace a las condiciones completas.<br/><b>Si está vacío, valor por defecto: Read the full terms</b>.
fmdbext_consent.required=Obligatorio
fmdbext_consent.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Validación:</b> La casilla debe marcarse para enviar el formulario.<br/><b>Nota:</b> <i>Activado por defecto</i>.

fmdbext_card=Campo Tarjetas
fmdbext_card.ui.tooltip=Una pregunta de opción única cuyas opciones se muestran como tarjetas en las que se puede hacer clic.<br/><b>Nota:</b> <i>El valor enviado es el valor de la opción elegida</i>.
fmdbext_card.helpText=Ayuda de entrada
fmdbext_card.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_card.required=Obligatorio
fmdbext_card.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío si no se ha seleccionado ninguna tarjeta.

fmdbext_phone=Campo Teléfono
fmdbext_phone.ui.tooltip=Un campo para un número de teléfono: los dispositivos móviles muestran el teclado telefónico, y el navegador puede proponer el número guardado del visitante.<br/><b>Nota:</b> <i>El valor enviado es el número tal como lo escribió el visitante</i>.
fmdbext_phone.helpText=Ayuda de entrada
fmdbext_phone.helpText.ui.tooltip=Indicación mostrada bajo la etiqueta del campo para ayudar a rellenarlo.<br/><b>Accesibilidad:</b> <i>Anunciada por los lectores de pantalla mediante aria-describedby</i>.
fmdbext_phone.placeholder=Texto de ejemplo
fmdbext_phone.placeholder.ui.tooltip=Texto mostrado dentro del campo de teléfono cuando está vacío.<br/><b>Ejemplo:</b> <i>+34 612 34 56 78</i>.
fmdbext_phone.defaultValue=Valor por defecto
fmdbext_phone.defaultValue.ui.tooltip=Valor prerrellenado que aparece al mostrar el campo por primera vez.<br/><b>Uso:</b> <i>Solo un número completo: un valor parcial, como un prefijo de país solo, no supera la comprobación del formato. Muestre el formato esperado con el texto de ejemplo</i>.
fmdbext_phone.pattern=Patrón de teléfono
fmdbext_phone.pattern.ui.tooltip=Expresión regular que el número debe cumplir, comprobada por el navegador y por el servidor.<br/><b>Por defecto:</b> <i>Un + inicial opcional, luego dígitos, espacios, puntos, guiones y paréntesis, con 6 a 15 dígitos</i>.<br/><b>Ejemplo:</b> <i>[+]41[0-9 ]{9,13} solo para números suizos en formato internacional</i>.<br/><b>Nota:</b> <i>Vacíelo para aceptar cualquier valor</i>.
fmdbext_phone.autocomplete=Autocompletado
fmdbext_phone.autocomplete.ui.tooltip=Relleno automático del navegador para este campo de teléfono.<br/><b>Uso:</b><br/>- <b>tel</b>: <i>Proponer el número de teléfono completo del visitante (por defecto)</i><br/>- <b>off</b>: <i>Desactivar el autocompletado</i><br/>- <b>Valor personalizado</b>: <i>Cualquier token de autocompletado HTML5 (p. ej. 'tel-national', 'mobile tel', 'work tel')</i>.
fmdbext_phone.minLength=Longitud mínima
fmdbext_phone.minLength.ui.tooltip=Número mínimo de caracteres en este campo de teléfono, separadores incluidos.<br/><b>Validación:</b> Impide enviar el formulario con un valor más corto.
fmdbext_phone.maxLength=Longitud máxima
fmdbext_phone.maxLength.ui.tooltip=Número máximo de caracteres permitidos en este campo de teléfono, separadores incluidos.<br/><b>Validación:</b> Impide introducir más caracteres de los indicados.
fmdbext_phone.required=Obligatorio
fmdbext_phone.required.ui.tooltip=Hace este campo obligatorio para enviar el formulario.<br/><b>Validación:</b> Impide el envío si el campo está vacío.
