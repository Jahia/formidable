fmdbext_rating=Input Rating
fmdbext_rating.ui.tooltip=A rating input rendered as a row of icons (stars, hearts, thumbs) or number chips.<br/><b>Note:</b> <i>The submitted value is a number between 1 and the maximum</i>.
fmdbext_rating.helpText=Input help
fmdbext_rating.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_rating.icon=Icon
fmdbext_rating.icon.ui.tooltip=Visual style of the rating items.<br/><b>Usage:</b> <i>Stars, hearts or thumbs for a graphical rating, numbers for a compact numeric row</i>.
fmdbext_rating.icon.star=Stars
fmdbext_rating.icon.heart=Hearts
fmdbext_rating.icon.thumb=Thumbs
fmdbext_rating.icon.number=Numbers
fmdbext_rating.maxValue=Maximum value
fmdbext_rating.maxValue.ui.tooltip=The rating scale goes from 1 to this value.<br/><b>Validation:</b> Must be between 2 and 10; out-of-range values are clamped at render time.<br/><b>Example:</b> <i>5 for a classic five-star rating</i>.
fmdbext_rating.minLabel=Low end label
fmdbext_rating.minLabel.ui.tooltip=Optional label displayed under the lowest rating.<br/><b>Example:</b> <i>"Poor"</i>.
fmdbext_rating.maxLabel=High end label
fmdbext_rating.maxLabel.ui.tooltip=Optional label displayed under the highest rating.<br/><b>Example:</b> <i>"Excellent"</i>.
fmdbext_rating.required=Required
fmdbext_rating.required.ui.tooltip=Makes this field mandatory for form submission.<br/><b>Validation:</b> Prevents form submission when no rating is selected.

fmdbext_scale=Input Scale
fmdbext_scale.ui.tooltip=A linear scale question rendered as a row of clickable value chips (one radio button per value), not a slider.<br/><b>Usage:</b> <i>Use the "Scale - Net Promoter Score (0-10)" view for the standard "how likely are you to recommend us?" question, with values locked to 0-10</i>.<br/><b>Note:</b> <i>The submitted value is a plain number</i>.
fmdbext_scale.helpText=Input help
fmdbext_scale.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_scale.minValue=Minimum value
fmdbext_scale.minValue.ui.tooltip=First value of the scale.<br/><b>Note:</b> <i>Ignored by the NPS view, which always uses 0</i>.
fmdbext_scale.maxValue=Maximum value
fmdbext_scale.maxValue.ui.tooltip=Last value of the scale.<br/><b>Note:</b> <i>Must be reachable from the minimum with the step increment; ignored by the NPS view, which always uses 10</i>.
fmdbext_scale.step=Step
fmdbext_scale.step.ui.tooltip=Increment between two consecutive values.<br/><b>Usage:</b> <i>1 for every value, 2 for one value out of two</i>.<br/><b>Note:</b> <i>Ignored by the NPS view, which always uses 1</i>.
fmdbext_scale.minLabel=Low end label
fmdbext_scale.minLabel.ui.tooltip=Optional label displayed under the lowest value.<br/><b>Example:</b> <i>"Not at all likely"</i>.
fmdbext_scale.maxLabel=High end label
fmdbext_scale.maxLabel.ui.tooltip=Optional label displayed under the highest value.<br/><b>Example:</b> <i>"Extremely likely"</i>.
fmdbext_scale.required=Required
fmdbext_scale.required.ui.tooltip=Makes this field mandatory for form submission.<br/><b>Validation:</b> Prevents form submission when no value is selected.

fmdbext_switch=Input Switch
fmdbext_switch.ui.tooltip=A boolean yes/no question.<br/><b>Note:</b> <i>The submitted value is true or false; state labels are presentation-only</i>.
fmdbext_switch.helpText=Input help
fmdbext_switch.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_switch.displayMode=Display as
fmdbext_switch.displayMode.ui.tooltip=Rendering of the field.<br/><b>Toggle:</b> a single on/off switch; when required, the switch must be ON to submit.<br/><b>Buttons:</b> two buttons (e.g. Yes / No); when required, one of them must be picked.<br/><b>Usage:</b> <i>Toggle for acknowledgements, Buttons for real yes/no questions</i>.
fmdbext_switch.displayMode.toggle=Toggle
fmdbext_switch.displayMode.buttons=Buttons
fmdbext_switch.onLabel=ON state label
fmdbext_switch.onLabel.ui.tooltip=Label of the positive state.<br/><b>Example:</b> <i>"Yes", "On", "Agree"</i>.<br/><b>Note:</b> <i>Presentation-only: the submitted value is always true</i>.
fmdbext_switch.offLabel=OFF state label
fmdbext_switch.offLabel.ui.tooltip=Label of the negative state.<br/><b>Example:</b> <i>"No", "Off", "Disagree"</i>.<br/><b>Note:</b> <i>Presentation-only: the submitted value is always false</i>.
fmdbext_switch.defaultState=Checked by default
fmdbext_switch.defaultState.ui.tooltip=Initial state of the field when the form is displayed.<br/><b>Note:</b> <i>In buttons mode only the ON button can be preselected; the field otherwise starts unanswered so "required" keeps its meaning</i>.
fmdbext_switch.required=Required
fmdbext_switch.required.ui.tooltip=Makes this field mandatory for form submission.<br/><b>Toggle mode:</b> the switch must be ON to submit.<br/><b>Buttons mode:</b> one of the two options must be selected.
fmdbext_switch.defaultOnLabel=Yes
fmdbext_switch.defaultOffLabel=No

fmdbext_consent=Input Consent
fmdbext_consent.ui.tooltip=An explicit terms / GDPR consent checkbox.<br/><b>Note:</b> <i>The stored value is simply "true"; the linked terms page or document must be readable by anonymous visitors</i>.
fmdbext_consent.helpText=Input help
fmdbext_consent.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_consent.statement=Consent statement
fmdbext_consent.statement.ui.tooltip=The consent wording displayed next to the checkbox.<br/><b>Example:</b> <i>"I agree to the processing of my personal data..."</i>.
fmdbext_consent.termsTarget=Terms page or document
fmdbext_consent.termsTarget.ui.tooltip=Optional link to the full terms (a page or an uploaded document).<br/><b>Note:</b> <i>It must be readable by anonymous visitors (guest permission), otherwise the link is not rendered for non-authenticated users</i>.
fmdbext_consent.termsLinkLabel=Terms link label
fmdbext_consent.termsLinkLabel.ui.tooltip=Label of the link to the full terms.<br/><b>If empty, default value: Read the full terms</b>.
fmdbext_consent.required=Required
fmdbext_consent.required.ui.tooltip=Makes this field mandatory for form submission.<br/><b>Validation:</b> The checkbox must be ticked to submit the form.<br/><b>Note:</b> <i>Enabled by default</i>.

fmdbext_card=Input Card
fmdbext_card.ui.tooltip=A single-choice question whose options are shown as clickable cards.<br/><b>Note:</b> <i>The submitted value is the value of the picked option</i>.
fmdbext_card.helpText=Input help
fmdbext_card.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_card.required=Required
fmdbext_card.required.ui.tooltip=Makes this field mandatory for form submission.<br/><b>Validation:</b> Prevents form submission when no card is selected.

fmdbext_phone=Input Phone
fmdbext_phone.ui.tooltip=A phone number input: mobile devices show the phone keypad, and the browser can fill in the visitor's saved number.<br/><b>Note:</b> <i>The submitted value is the number as the visitor typed it</i>.
fmdbext_phone.helpText=Input help
fmdbext_phone.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_phone.placeholder=Placeholder
fmdbext_phone.placeholder.ui.tooltip=Text displayed inside the phone field when empty.<br/><b>Example:</b> <i>+33 6 12 34 56 78</i>.
fmdbext_phone.defaultValue=Default value
fmdbext_phone.defaultValue.ui.tooltip=Pre-filled value that appears when the field is first rendered.<br/><b>Usage:</b> <i>A full number only: a partial value such as a country code alone fails the format check. Show the expected format with the placeholder instead</i>.
fmdbext_phone.pattern=Phone pattern
fmdbext_phone.pattern.ui.tooltip=Regular expression the number must match, checked by the browser and by the server.<br/><b>Default:</b> <i>An optional leading +, then digits, spaces, dots, hyphens and parentheses, with 6 to 15 digits</i>.<br/><b>Example:</b> <i>[+]41[0-9 ]{9,13} for Swiss numbers in international format only</i>.<br/><b>Note:</b> <i>To accept any value, turn off Check the phone format</i>.
fmdbext_phone.checkFormat=Check the phone format
fmdbext_phone.checkFormat.ui.tooltip=Checks the number against the phone pattern, in the browser and on the server.<br/><b>Off:</b> <i>Any value is accepted, such as an extension or a text</i>.
fmdbext_phone.autocomplete=Autocomplete
fmdbext_phone.autocomplete.ui.tooltip=Browser autofill for this phone field.<br/><b>Usage:</b><br/>- <b>tel</b>: <i>Offer the visitor's full phone number (default)</i><br/>- <b>off</b>: <i>Disable autocomplete</i><br/>- <b>Custom value</b>: <i>Any HTML5 autocomplete token (e.g., 'tel-national', 'mobile tel', 'work tel')</i>.
fmdbext_phone.minLength=Minimum length
fmdbext_phone.minLength.ui.tooltip=Minimum number of characters in this phone field, separators included.<br/><b>Validation:</b> Prevents form submission with a shorter value.
fmdbext_phone.maxLength=Maximum length
fmdbext_phone.maxLength.ui.tooltip=Maximum number of characters allowed in this phone field, separators included.<br/><b>Validation:</b> Prevents users from entering more characters than specified.
fmdbext_phone.required=Required
fmdbext_phone.required.ui.tooltip=Makes this field mandatory for form submission.<br/><b>Validation:</b> Prevents form submission when the field is empty.
