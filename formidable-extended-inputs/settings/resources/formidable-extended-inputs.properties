fmdbext_rating=Input Rating
fmdbext_rating.ui.tooltip=A rating input rendered as a row of icons (stars, hearts, thumbs) or number chips. The submitted value is a number between 1 and the maximum.
fmdbext_rating.helpText=Input help
fmdbext_rating.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_rating.icon=Icon
fmdbext_rating.icon.ui.tooltip=Visual style of the rating items.
fmdbext_rating.icon.star=Stars
fmdbext_rating.icon.heart=Hearts
fmdbext_rating.icon.thumb=Thumbs
fmdbext_rating.icon.number=Numbers
fmdbext_rating.maxValue=Maximum value
fmdbext_rating.maxValue.ui.tooltip=The rating scale goes from 1 to this value (between 2 and 10).
fmdbext_rating.minLabel=Low end label
fmdbext_rating.minLabel.ui.tooltip=Optional label displayed under the lowest rating (e.g. "Poor").
fmdbext_rating.maxLabel=High end label
fmdbext_rating.maxLabel.ui.tooltip=Optional label displayed under the highest rating (e.g. "Excellent").
fmdbext_rating.required=Required
fmdbext_rating.required.ui.tooltip=Makes this field mandatory for form submission: a rating must be selected.

fmdbext_scale=Input Scale
fmdbext_scale.ui.tooltip=A linear scale rendered as a row of number chips. The submitted value is a plain number. Use the "Scale - NPS (0-10)" view for a standard Net Promoter Score question.
fmdbext_scale.helpText=Input help
fmdbext_scale.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_scale.minValue=Minimum value
fmdbext_scale.minValue.ui.tooltip=First value of the scale (ignored by the NPS view, which always uses 0).
fmdbext_scale.maxValue=Maximum value
fmdbext_scale.maxValue.ui.tooltip=Last value of the scale (ignored by the NPS view, which always uses 10).
fmdbext_scale.step=Step
fmdbext_scale.step.ui.tooltip=Increment between two values (ignored by the NPS view, which always uses 1).
fmdbext_scale.minLabel=Low end label
fmdbext_scale.minLabel.ui.tooltip=Optional label displayed under the lowest value (e.g. "Not at all likely").
fmdbext_scale.maxLabel=High end label
fmdbext_scale.maxLabel.ui.tooltip=Optional label displayed under the highest value (e.g. "Extremely likely").
fmdbext_scale.required=Required
fmdbext_scale.required.ui.tooltip=Makes this field mandatory for form submission: a value must be selected.

fmdbext_switch=Input Switch
fmdbext_switch.ui.tooltip=A boolean yes/no question. The submitted value is true or false; state labels are presentation-only.
fmdbext_switch.helpText=Input help
fmdbext_switch.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_switch.displayMode=Display as
fmdbext_switch.displayMode.ui.tooltip=<b>Toggle:</b> a single on/off switch; when required, the switch must be ON to submit - use for acknowledgements.<br/><b>Buttons:</b> two buttons (e.g. Yes / No); when required, one of them must be picked - use for real yes/no questions.
fmdbext_switch.displayMode.toggle=Toggle
fmdbext_switch.displayMode.buttons=Buttons
fmdbext_switch.onLabel=ON state label
fmdbext_switch.onLabel.ui.tooltip=Label of the positive state (e.g. "Yes", "On", "Agree").
fmdbext_switch.offLabel=OFF state label
fmdbext_switch.offLabel.ui.tooltip=Label of the negative state (e.g. "No", "Off", "Disagree").
fmdbext_switch.defaultState=Checked by default
fmdbext_switch.defaultState.ui.tooltip=Initial state of the field when the form is displayed.
fmdbext_switch.required=Required
fmdbext_switch.required.ui.tooltip=<b>Toggle mode:</b> the switch must be ON to submit.<br/><b>Buttons mode:</b> one of the two options must be selected.
fmdbext_switch.defaultOnLabel=Yes
fmdbext_switch.defaultOffLabel=No

fmdbext_consent=Input Consent
fmdbext_consent.ui.tooltip=An explicit terms / GDPR consent checkbox. The stored value is simply "true".<br/><b>Important:</b> the linked terms page or document must be readable by anonymous visitors.
fmdbext_consent.helpText=Input help
fmdbext_consent.helpText.ui.tooltip=Guidance displayed below the field label to help users fill the field.<br/><b>Accessibility:</b> <i>Announced by screen readers via aria-describedby</i>.
fmdbext_consent.statement=Consent statement
fmdbext_consent.statement.ui.tooltip=The consent wording displayed next to the checkbox (e.g. "I agree to the processing of my personal data...").
fmdbext_consent.termsTarget=Terms page or document
fmdbext_consent.termsTarget.ui.tooltip=Optional link to the full terms (a page or an uploaded document).<br/><b>Important:</b> it must be readable by anonymous visitors (guest permission), otherwise the link will fail for non-authenticated users.
fmdbext_consent.termsLinkLabel=Terms link label
fmdbext_consent.termsLinkLabel.ui.tooltip=Label of the link to the full terms. Defaults to "Read the full terms".
fmdbext_consent.required=Required
fmdbext_consent.required.ui.tooltip=When enabled (default), the checkbox must be ticked to submit the form.
