fmdbext_rating=Eingabefeld Bewertung
fmdbext_rating.ui.tooltip=Ein Bewertungsfeld, dargestellt als Reihe von Symbolen (Sterne, Herzen, Daumen) oder Zahlen-Chips.<br/><b>Hinweis:</b> <i>Der übermittelte Wert ist eine Zahl zwischen 1 und dem Maximum</i>.
fmdbext_rating.helpText=Eingabehilfe
fmdbext_rating.helpText.ui.tooltip=Hinweis unter der Feldbeschriftung, der beim Ausfüllen hilft.<br/><b>Barrierefreiheit:</b> <i>Wird von Screenreadern über aria-describedby vorgelesen</i>.
fmdbext_rating.icon=Symbol
fmdbext_rating.icon.ui.tooltip=Visueller Stil der Bewertungselemente.<br/><b>Verwendung:</b> <i>Sterne, Herzen oder Daumen für eine grafische Bewertung, Zahlen für eine kompakte numerische Reihe</i>.
fmdbext_rating.icon.star=Sterne
fmdbext_rating.icon.heart=Herzen
fmdbext_rating.icon.thumb=Daumen
fmdbext_rating.icon.number=Zahlen
fmdbext_rating.maxValue=Maximalwert
fmdbext_rating.maxValue.ui.tooltip=Die Bewertungsskala reicht von 1 bis zu diesem Wert.<br/><b>Validierung:</b> Muss zwischen 2 und 10 liegen; Werte außerhalb dieses Bereichs werden beim Rendern begrenzt.<br/><b>Beispiel:</b> <i>5 für eine klassische Fünf-Sterne-Bewertung</i>.
fmdbext_rating.minLabel=Beschriftung Minimum
fmdbext_rating.minLabel.ui.tooltip=Optionale Beschriftung unter der niedrigsten Bewertung.<br/><b>Beispiel:</b> <i>„Schlecht“</i>.
fmdbext_rating.maxLabel=Beschriftung Maximum
fmdbext_rating.maxLabel.ui.tooltip=Optionale Beschriftung unter der höchsten Bewertung.<br/><b>Beispiel:</b> <i>„Ausgezeichnet“</i>.
fmdbext_rating.required=Pflichtfeld
fmdbext_rating.required.ui.tooltip=Macht dieses Feld für das Absenden des Formulars verpflichtend.<br/><b>Validierung:</b> Verhindert das Absenden, wenn keine Bewertung ausgewählt ist.

fmdbext_scale=Eingabefeld Skala
fmdbext_scale.ui.tooltip=Eine lineare Skalenfrage, dargestellt als Reihe anklickbarer Zahlen-Chips (ein Radiobutton pro Wert), kein Schieberegler.<br/><b>Verwendung:</b> <i>Verwenden Sie die Ansicht „Scale - Net Promoter Score (0-10)“ für die Standardfrage „Wie wahrscheinlich ist es, dass Sie uns weiterempfehlen?“, mit fest auf 0-10 gesetzten Werten</i>.<br/><b>Hinweis:</b> <i>Der übermittelte Wert ist eine Zahl</i>.
fmdbext_scale.helpText=Eingabehilfe
fmdbext_scale.helpText.ui.tooltip=Hinweis unter der Feldbeschriftung, der beim Ausfüllen hilft.<br/><b>Barrierefreiheit:</b> <i>Wird von Screenreadern über aria-describedby vorgelesen</i>.
fmdbext_scale.minValue=Minimalwert
fmdbext_scale.minValue.ui.tooltip=Erster Wert der Skala.<br/><b>Hinweis:</b> <i>Wird von der NPS-Ansicht ignoriert, die immer 0 verwendet</i>.
fmdbext_scale.maxValue=Maximalwert
fmdbext_scale.maxValue.ui.tooltip=Letzter Wert der Skala.<br/><b>Hinweis:</b> <i>Muss vom Minimum aus mit der Schrittweite erreichbar sein; wird von der NPS-Ansicht ignoriert, die immer 10 verwendet</i>.
fmdbext_scale.step=Schrittweite
fmdbext_scale.step.ui.tooltip=Abstand zwischen zwei aufeinanderfolgenden Werten.<br/><b>Verwendung:</b> <i>1 für jeden Wert, 2 für jeden zweiten Wert</i>.<br/><b>Hinweis:</b> <i>Wird von der NPS-Ansicht ignoriert, die immer 1 verwendet</i>.
fmdbext_scale.minLabel=Beschriftung Minimum
fmdbext_scale.minLabel.ui.tooltip=Optionale Beschriftung unter dem niedrigsten Wert.<br/><b>Beispiel:</b> <i>„Sehr unwahrscheinlich“</i>.
fmdbext_scale.maxLabel=Beschriftung Maximum
fmdbext_scale.maxLabel.ui.tooltip=Optionale Beschriftung unter dem höchsten Wert.<br/><b>Beispiel:</b> <i>„Äußerst wahrscheinlich“</i>.
fmdbext_scale.required=Pflichtfeld
fmdbext_scale.required.ui.tooltip=Macht dieses Feld für das Absenden des Formulars verpflichtend.<br/><b>Validierung:</b> Verhindert das Absenden, wenn kein Wert ausgewählt ist.

fmdbext_switch=Eingabefeld Schalter
fmdbext_switch.ui.tooltip=Eine boolesche Ja/Nein-Frage.<br/><b>Hinweis:</b> <i>Der übermittelte Wert ist true oder false; die Zustandsbeschriftungen sind rein visuell</i>.
fmdbext_switch.helpText=Eingabehilfe
fmdbext_switch.helpText.ui.tooltip=Hinweis unter der Feldbeschriftung, der beim Ausfüllen hilft.<br/><b>Barrierefreiheit:</b> <i>Wird von Screenreadern über aria-describedby vorgelesen</i>.
fmdbext_switch.displayMode=Darstellung
fmdbext_switch.displayMode.ui.tooltip=Darstellung des Feldes.<br/><b>Schalter:</b> ein einzelner Ein/Aus-Schalter; als Pflichtfeld muss er zum Absenden eingeschaltet sein.<br/><b>Schaltflächen:</b> zwei Schaltflächen (z. B. Ja / Nein); als Pflichtfeld muss eine gewählt werden.<br/><b>Verwendung:</b> <i>Schalter für Bestätigungen, Schaltflächen für echte Ja/Nein-Fragen</i>.
fmdbext_switch.displayMode.toggle=Schalter
fmdbext_switch.displayMode.buttons=Schaltflächen
fmdbext_switch.onLabel=Beschriftung EIN
fmdbext_switch.onLabel.ui.tooltip=Beschriftung des positiven Zustands.<br/><b>Beispiel:</b> <i>„Ja“, „Ein“, „Einverstanden“</i>.<br/><b>Hinweis:</b> <i>Rein visuell: Der übermittelte Wert ist immer true</i>.
fmdbext_switch.offLabel=Beschriftung AUS
fmdbext_switch.offLabel.ui.tooltip=Beschriftung des negativen Zustands.<br/><b>Beispiel:</b> <i>„Nein“, „Aus“, „Nicht einverstanden“</i>.<br/><b>Hinweis:</b> <i>Rein visuell: Der übermittelte Wert ist immer false</i>.
fmdbext_switch.defaultState=Standardmäßig aktiviert
fmdbext_switch.defaultState.ui.tooltip=Anfangszustand des Feldes beim Anzeigen des Formulars.<br/><b>Hinweis:</b> <i>Im Schaltflächen-Modus kann nur die EIN-Schaltfläche vorausgewählt werden; andernfalls beginnt das Feld unbeantwortet, damit „Pflichtfeld“ seine Bedeutung behält</i>.
fmdbext_switch.required=Pflichtfeld
fmdbext_switch.required.ui.tooltip=Macht dieses Feld für das Absenden des Formulars verpflichtend.<br/><b>Schalter-Modus:</b> Der Schalter muss zum Absenden eingeschaltet sein.<br/><b>Schaltflächen-Modus:</b> Eine der beiden Optionen muss ausgewählt werden.
fmdbext_switch.defaultOnLabel=Ja
fmdbext_switch.defaultOffLabel=Nein

fmdbext_consent=Eingabefeld Einwilligung
fmdbext_consent.ui.tooltip=Eine explizite Einwilligungs-Checkbox (AGB / DSGVO).<br/><b>Hinweis:</b> <i>Der gespeicherte Wert ist einfach „true“; die verlinkte Seite bzw. das verlinkte Dokument muss für anonyme Besucher lesbar sein</i>.
fmdbext_consent.helpText=Eingabehilfe
fmdbext_consent.helpText.ui.tooltip=Hinweis unter der Feldbeschriftung, der beim Ausfüllen hilft.<br/><b>Barrierefreiheit:</b> <i>Wird von Screenreadern über aria-describedby vorgelesen</i>.
fmdbext_consent.statement=Einwilligungstext
fmdbext_consent.statement.ui.tooltip=Der neben der Checkbox angezeigte Einwilligungstext.<br/><b>Beispiel:</b> <i>„Ich stimme der Verarbeitung meiner personenbezogenen Daten zu ...“</i>.
fmdbext_consent.termsTarget=Seite oder Dokument der Bedingungen
fmdbext_consent.termsTarget.ui.tooltip=Optionaler Link zu den vollständigen Bedingungen (eine Seite oder ein hochgeladenes Dokument).<br/><b>Hinweis:</b> <i>Muss für anonyme Besucher lesbar sein (Gast-Berechtigung), sonst wird der Link für nicht angemeldete Benutzer nicht angezeigt</i>.
fmdbext_consent.termsLinkLabel=Link-Beschriftung
fmdbext_consent.termsLinkLabel.ui.tooltip=Beschriftung des Links zu den vollständigen Bedingungen.<br/><b>Wenn leer, Standardwert: Read the full terms</b>.
fmdbext_consent.required=Pflichtfeld
fmdbext_consent.required.ui.tooltip=Macht dieses Feld für das Absenden des Formulars verpflichtend.<br/><b>Validierung:</b> Die Checkbox muss zum Absenden des Formulars angehakt sein.<br/><b>Hinweis:</b> <i>Standardmäßig aktiviert</i>.
