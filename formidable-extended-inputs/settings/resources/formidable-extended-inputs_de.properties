fmdbext_rating=Eingabefeld Bewertung
fmdbext_rating.ui.tooltip=Ein Bewertungsfeld, dargestellt als Reihe von Symbolen (Sterne, Herzen, Daumen) oder Zahlen-Chips. Der übermittelte Wert ist eine Zahl zwischen 1 und dem Maximum.
fmdbext_rating.helpText=Eingabehilfe
fmdbext_rating.helpText.ui.tooltip=Hinweis unter der Feldbeschriftung, der beim Ausfüllen hilft.<br/><b>Barrierefreiheit:</b> <i>Wird von Screenreadern über aria-describedby vorgelesen</i>.
fmdbext_rating.icon=Symbol
fmdbext_rating.icon.ui.tooltip=Visueller Stil der Bewertungselemente.
fmdbext_rating.icon.star=Sterne
fmdbext_rating.icon.heart=Herzen
fmdbext_rating.icon.thumb=Daumen
fmdbext_rating.icon.number=Zahlen
fmdbext_rating.maxValue=Maximalwert
fmdbext_rating.maxValue.ui.tooltip=Die Bewertungsskala reicht von 1 bis zu diesem Wert (zwischen 2 und 10).
fmdbext_rating.minLabel=Beschriftung Minimum
fmdbext_rating.minLabel.ui.tooltip=Optionale Beschriftung unter der niedrigsten Bewertung (z. B. „Schlecht“).
fmdbext_rating.maxLabel=Beschriftung Maximum
fmdbext_rating.maxLabel.ui.tooltip=Optionale Beschriftung unter der höchsten Bewertung (z. B. „Ausgezeichnet“).
fmdbext_rating.required=Pflichtfeld
fmdbext_rating.required.ui.tooltip=Macht dieses Feld für das Absenden des Formulars verpflichtend: Eine Bewertung muss ausgewählt werden.

fmdbext_scale=Eingabefeld Skala
fmdbext_scale.ui.tooltip=Eine lineare Skala, dargestellt als Reihe von Zahlen-Chips. Der übermittelte Wert ist eine Zahl. Verwenden Sie die Ansicht „Scale - NPS (0-10)“ für eine Standard-Net-Promoter-Score-Frage.
fmdbext_scale.helpText=Eingabehilfe
fmdbext_scale.helpText.ui.tooltip=Hinweis unter der Feldbeschriftung, der beim Ausfüllen hilft.<br/><b>Barrierefreiheit:</b> <i>Wird von Screenreadern über aria-describedby vorgelesen</i>.
fmdbext_scale.minValue=Minimalwert
fmdbext_scale.minValue.ui.tooltip=Erster Wert der Skala (wird von der NPS-Ansicht ignoriert, die immer 0 verwendet).
fmdbext_scale.maxValue=Maximalwert
fmdbext_scale.maxValue.ui.tooltip=Letzter Wert der Skala (wird von der NPS-Ansicht ignoriert, die immer 10 verwendet).
fmdbext_scale.step=Schrittweite
fmdbext_scale.step.ui.tooltip=Abstand zwischen zwei Werten (wird von der NPS-Ansicht ignoriert, die immer 1 verwendet).
fmdbext_scale.minLabel=Beschriftung Minimum
fmdbext_scale.minLabel.ui.tooltip=Optionale Beschriftung unter dem niedrigsten Wert (z. B. „Sehr unwahrscheinlich“).
fmdbext_scale.maxLabel=Beschriftung Maximum
fmdbext_scale.maxLabel.ui.tooltip=Optionale Beschriftung unter dem höchsten Wert (z. B. „Äußerst wahrscheinlich“).
fmdbext_scale.required=Pflichtfeld
fmdbext_scale.required.ui.tooltip=Macht dieses Feld für das Absenden des Formulars verpflichtend: Ein Wert muss ausgewählt werden.

fmdbext_switch=Eingabefeld Schalter
fmdbext_switch.ui.tooltip=Eine boolesche Ja/Nein-Frage. Der übermittelte Wert ist true oder false; die Zustandsbeschriftungen sind rein visuell.
fmdbext_switch.helpText=Eingabehilfe
fmdbext_switch.helpText.ui.tooltip=Hinweis unter der Feldbeschriftung, der beim Ausfüllen hilft.<br/><b>Barrierefreiheit:</b> <i>Wird von Screenreadern über aria-describedby vorgelesen</i>.
fmdbext_switch.displayMode=Darstellung
fmdbext_switch.displayMode.ui.tooltip=<b>Schalter:</b> ein einzelner Ein/Aus-Schalter; als Pflichtfeld muss er eingeschaltet sein - für Bestätigungen geeignet.<br/><b>Schaltflächen:</b> zwei Schaltflächen (z. B. Ja / Nein); als Pflichtfeld muss eine gewählt werden - für echte Ja/Nein-Fragen.
fmdbext_switch.displayMode.toggle=Schalter
fmdbext_switch.displayMode.buttons=Schaltflächen
fmdbext_switch.onLabel=Beschriftung EIN
fmdbext_switch.onLabel.ui.tooltip=Beschriftung des positiven Zustands (z. B. „Ja“, „Ein“, „Einverstanden“).
fmdbext_switch.offLabel=Beschriftung AUS
fmdbext_switch.offLabel.ui.tooltip=Beschriftung des negativen Zustands (z. B. „Nein“, „Aus“, „Nicht einverstanden“).
fmdbext_switch.defaultState=Standardmäßig aktiviert
fmdbext_switch.defaultState.ui.tooltip=Anfangszustand des Feldes beim Anzeigen des Formulars.
fmdbext_switch.required=Pflichtfeld
fmdbext_switch.required.ui.tooltip=<b>Schalter-Modus:</b> Der Schalter muss zum Absenden eingeschaltet sein.<br/><b>Schaltflächen-Modus:</b> Eine der beiden Optionen muss ausgewählt werden.
fmdbext_switch.defaultOnLabel=Ja
fmdbext_switch.defaultOffLabel=Nein

fmdbext_consent=Eingabefeld Einwilligung
fmdbext_consent.ui.tooltip=Eine explizite Einwilligungs-Checkbox (AGB / DSGVO). Der gespeicherte Wert ist einfach „true“.<br/><b>Wichtig:</b> Die verlinkte Seite bzw. das verlinkte Dokument muss für anonyme Besucher lesbar sein.
fmdbext_consent.helpText=Eingabehilfe
fmdbext_consent.helpText.ui.tooltip=Hinweis unter der Feldbeschriftung, der beim Ausfüllen hilft.<br/><b>Barrierefreiheit:</b> <i>Wird von Screenreadern über aria-describedby vorgelesen</i>.
fmdbext_consent.statement=Einwilligungstext
fmdbext_consent.statement.ui.tooltip=Der neben der Checkbox angezeigte Einwilligungstext (z. B. „Ich stimme der Verarbeitung meiner personenbezogenen Daten zu ...“).
fmdbext_consent.termsTarget=Seite oder Dokument der Bedingungen
fmdbext_consent.termsTarget.ui.tooltip=Optionaler Link zu den vollständigen Bedingungen (eine Seite oder ein hochgeladenes Dokument).<br/><b>Wichtig:</b> Muss für anonyme Besucher lesbar sein (Gast-Berechtigung), sonst schlägt der Link für nicht angemeldete Benutzer fehl.
fmdbext_consent.termsLinkLabel=Link-Beschriftung
fmdbext_consent.termsLinkLabel.ui.tooltip=Beschriftung des Links zu den vollständigen Bedingungen.
fmdbext_consent.required=Pflichtfeld
fmdbext_consent.required.ui.tooltip=Wenn aktiviert (Standard), muss die Checkbox zum Absenden des Formulars angehakt sein.
