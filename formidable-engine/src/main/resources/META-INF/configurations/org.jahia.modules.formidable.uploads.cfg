# default configuration - deployed once, then kept as edited.
# Formidable — Uploads (PID org.jahia.modules.formidable.uploads). One of the five configuration files of the
# module, one per theme: captcha, uploads, choiceOptions, formActions, fieldActions. Jahia copies each file
# to digital-factory-data/karaf/etc the first time the module starts without it there, and the line above
# tells Jahia never to overwrite that copy: edit it, or use the provisioning API (editConfiguration), your
# changes are kept. Avoid the Felix Web Console for these PIDs: it rewrites the file in a typed syntax
# (L"5", quoted strings) a .cfg file does not read back. Every value below is the built-in default.
#
# The limits of a submission carrying files, and the MIME types a file field accepts when it declares none.
# A zero or negative limit is refused and the default applies.
uploadMaxFileSizeBytes=10485760
uploadMaxRequestSizeBytes=52428800
uploadMaxFileCount=10
uploadAllowedMimeTypes=image/jpeg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.oasis.opendocument.text,application/vnd.oasis.opendocument.spreadsheet,text/plain,text/csv,video/mp4,video/webm,video/ogg,video/x-matroska
