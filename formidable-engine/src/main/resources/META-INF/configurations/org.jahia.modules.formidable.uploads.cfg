# default configuration - deployed once, then kept as edited.
# Formidable - Uploads (PID org.jahia.modules.formidable.uploads). One of the six configuration files of the
# module, one per theme: captcha, uploads, choiceOptions, formActions, fieldActions, formsImport. Jahia copies each file
# to digital-factory-data/karaf/etc the first time the module starts without it there, and the line above
# tells Jahia never to overwrite that copy: edit it, or use the provisioning API (editConfiguration), your
# changes are kept. Avoid the Felix Web Console for these PIDs: it rewrites the file in a typed syntax
# (L"5", quoted strings) a .cfg file does not read back. Every value below is the built-in default.
#
# The limits of a submission carrying files, and the file types a file field may accept.
# A zero or negative limit is refused and the default applies.
uploadMaxFileSizeBytes=10485760
uploadMaxRequestSizeBytes=52428800
uploadMaxFileCount=10
# The file types, comma-separated: an extension (pdf, docx), a MIME type (application/pdf), a wildcard (image/*)
# or */* for any file. An extension stands for the MIME type Apache Tika gives it, an alias (audio/x-wav) for its
# canonical type (audio/vnd.wave) - the log lists them at each start - and every uploaded file's type is
# detected by Tika and checked against these (for a zip or OLE2 container - docx, xlsx, odt, doc, xls - the
# family by content, the kind by name). When an extension is shared by several types, give the MIME type:
# ogg is read as audio/vorbis (an Ogg video is ogv, video/ogg). Tika's registry, the version this module embeds,
# says which type an extension stands for:
# https://github.com/apache/tika/blob/3.3.2/tika-core/src/main/resources/org/apache/tika/mime/tika-mimetypes.xml
# A file field without accepted types accepts all of these; a field with some keeps those still listed here.
# Empty: no file is accepted. A long list may go on over several lines, each but the last ending with ",\".
uploadAllowedTypes=jpg,png,gif,webp,pdf,doc,docx,xls,xlsx,odt,ods,txt,csv,mp4,webm,ogv,mkv
