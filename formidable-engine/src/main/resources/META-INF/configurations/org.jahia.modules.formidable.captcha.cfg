# default configuration - deployed once, then kept as edited.
# Formidable - CAPTCHA (PID org.jahia.modules.formidable.captcha). One of the five configuration files of the
# module, one per theme: captcha, uploads, choiceOptions, formActions, fieldActions. Jahia copies each file
# to digital-factory-data/karaf/etc the first time the module starts without it there, and the line above
# tells Jahia never to overwrite that copy: edit it, or use the provisioning API (editConfiguration), your
# changes are kept. Avoid the Felix Web Console for these PIDs: it rewrites the file in a typed syntax
# (L"5", quoted strings) a .cfg file does not read back. Every value below is the built-in default.
#
# The provider a form may require (fmdbmix:captcha on the form): its keys, its script and verification
# endpoints, the timeouts. Verification is configured when the site key, the secret key and the HTTPS
# verification URL are all set; the widget renders when the site key, the script URL, the widget variable
# and the token field are all set.
captchaSiteKey=
captchaSecretKey=
captchaScriptUrl=
captchaWidgetVar=
captchaTokenField=
captchaVerifyUrl=
captchaHttpConnectTimeoutSeconds=5
captchaHttpRequestTimeoutSeconds=10
