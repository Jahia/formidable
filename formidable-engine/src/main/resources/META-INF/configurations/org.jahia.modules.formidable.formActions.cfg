# default configuration - deployed once, then kept as edited.
# Formidable - Form actions (PID org.jahia.modules.formidable.formActions). One of the six configuration
# files of the module, one per theme: captcha, uploads, choiceOptions, formActions, fieldActions, formsImport. Jahia copies
# each file to digital-factory-data/karaf/etc the first time the module starts without it there, and the line
# above tells Jahia never to overwrite that copy: edit it, or use the provisioning API (editConfiguration),
# your changes are kept. Avoid the Felix Web Console for these PIDs: it rewrites the file in a typed syntax
# (L"5", quoted strings) a .cfg file does not read back. Every value below is the built-in default.
#
# The services a forward action may send a submission to are NOT in this file: one file each, next to this one,
#   org.jahia.modules.formidable.formActions.target-<id>.cfg
# with a required id setting, what a forward action stores. For a CRM, the file
# org.jahia.modules.formidable.formActions.target-crm-prod.cfg holds:
#   id=crm-prod
#   label=CRM (production)
#   url=https://crm.example.com/hook
# The URL must be HTTPS; it stays in the file and never reaches a contributor. Remove a file to remove the target.
# A file a module ships (under META-INF/configurations) comes back at the module's next start once removed:
# empty its id instead, and the entry counts for nothing. A shipped file that carries "# default configuration",
# as Formidable's own do, is copied only while yours is missing; one without it is written back at every start.
#
# A service on this machine is a target file with development=true and a plain-HTTP URL on localhost or
# host.docker.internal; such files are honoured only while this switch is on:
enableDevForwardTargets=false
forwardHttpConnectTimeoutSeconds=5
forwardHttpRequestTimeoutSeconds=10
