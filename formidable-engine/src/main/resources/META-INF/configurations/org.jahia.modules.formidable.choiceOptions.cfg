# default configuration - deployed once, then kept as edited.
# Formidable - Choice options (PID org.jahia.modules.formidable.choiceOptions). One of the five configuration
# files of the module, one per theme: captcha, uploads, choiceOptions, formActions, fieldActions. Jahia copies
# each file to digital-factory-data/karaf/etc the first time the module starts without it there, and the line
# above tells Jahia never to overwrite that copy: edit it, or use the provisioning API (editConfiguration),
# your changes are kept. Avoid the Felix Web Console for these PIDs: it rewrites the file in a typed syntax
# (L"5", quoted strings) a .cfg file does not read back. Every value below is the built-in default.
#
# The sources a choice field may take its options from.
# Each entry: id|Label|initializerKey or id|Label|initializerKey|param
# initializerKey is the key of a Jahia choicelist initializer (e.g. country, language).
# The id is stored in JCR; only sources listed here are exposed to contributors.
# Leave empty to disable sourced options (fail-safe default).
# One source per line INSIDE the value: an escaped \n followed by a \ line continuation, as in
# the example (two plain lines would be read as two keys). The provisioning API and the Felix
# console write the same value on a single line, with a literal \n between the entries.
# Example:
#   optionsSources=countries|Countries|country\n\
#     departments|Departments|myModuleDepartmentsInitializer
optionsSources=
optionsSourcesCacheTtlSeconds=300
# Maximum number of options a content-mode choice field may resolve. Above the
# limit the field fails explicitly like a failing source, so contributors
# re-scope their root instead of visitors silently missing options.
optionsQueryMaxResults=100
