# default configuration - deployed once, then kept as edited.
# Formidable — Field actions (PID org.jahia.modules.formidable.fieldActions). One of the five configuration
# files of the module, one per theme: captcha, uploads, choiceOptions, formActions, fieldActions. Jahia copies
# each file to digital-factory-data/karaf/etc the first time the module starts without it there, and the line
# above tells Jahia never to overwrite that copy: edit it, or use the provisioning API (editConfiguration),
# your changes are kept. Avoid the Felix Web Console for these PIDs: it rewrites the file in a typed syntax
# (L"5", quoted strings) a .cfg file does not read back. Every value below is the built-in default.
#
# The external services a field action may call through the FieldActionGateway.
# Each entry: id|Label|https://base-url|Credential-Header-Name|credential (the last two together, or neither),
# with an optional sixth part saying where the credential goes: header (the default) or query, for a provider
# that reads its key off the URL, as a parameter of that name (zerobounce|ZeroBounce|https://api.zerobounce.net|api_key|<key>|query).
# The id is stored in JCR on the field-action node; the base URL, the header and the credential stay
# here and never reach a contributor, the visitor's page or a log line.
# One provider per line INSIDE the value, with the same \n\ continuation as optionsSources.
# Example:
#   fieldActionProviders=email-check|Email verification|https://api.example.com/v1|X-Api-Key|s3cr3t\n\
#     crm|Customer directory|https://crm.internal/api
fieldActionProviders=
enableDevFieldActionProviders=false
# Development-only providers, in the same form. Only plain HTTP on localhost or host.docker.internal is accepted.
# Ignored unless enableDevFieldActionProviders=true. A double of a provider is declared here, such as the samples
# module's Experian stub:
#   devFieldActionProviders=experian-stub|Experian (stub)|http://localhost:8080/modules/formidable-samples/experian-stub|Auth-Token|stub-token
devFieldActionProviders=
fieldActionHttpConnectTimeoutSeconds=5
fieldActionHttpRequestTimeoutSeconds=10
# Verdicts kept per action, language and value, so the check run while the visitor filled the form costs no
# second provider call at submission. 0 disables the cache.
fieldActionVerdictCacheTtlSeconds=300
# Pre-checks accepted per client address and minute on /modules/formidable-engine/field-action;
# 0 disables the endpoint (the field actions then run at submission only).
fieldActionRateLimitPerMinute=30
# Longest value a pre-check accepts from the browser (HTTP 413 above).
fieldActionMaxValueLength=512
# DISTINCT values of ONE field the submission judges with that field's blocking actions. A field name can be
# submitted many times over and each distinct value may cost a provider call — repeats are counted once —
# so a submission carrying more than this for one field is refused (FMDB-017) before anything runs.
# Above a plausible option count on purpose: an "interests" checkbox group is an ordinary thing to build.
fieldActionMaxValuesPerField=50
