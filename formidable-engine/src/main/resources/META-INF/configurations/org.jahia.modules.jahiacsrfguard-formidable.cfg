# The form submission endpoint is public by design: every visitor, anonymous or
# authenticated, posts to it without an OWASP CSRFGuard token — the markup of a
# published form carries none. Cross-site submissions are already rejected by the
# engine's own same-origin guard, so the token requirement jahia-csrf-guard 4.3
# started enforcing on authenticated sessions is lifted for this single endpoint.
whitelist = /modules/formidable-engine/form-submit*
