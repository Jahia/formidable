formidable-submit:
  description: Can submit Formidable forms
  metadata:
    visible: false
  auto_apply:
    - origin: hosted
  grants:
    - api: formidable-submit
      node: none
formidable-field-action:
  description: Can ask a Formidable form to check one field's value
  metadata:
    visible: false
  auto_apply:
    - origin: hosted
  grants:
    - api: formidable-field-action
      node: none
formidable-import:
  description: Can import the forms and results of another form system into a site, from the Results page
  metadata:
    visible: false
  auto_apply:
    - origin: hosted
  grants:
    - api: formidable-import
      node: none
