fmdbmix_relativeMaxDatetime=Relativer maximaler Zeitpunkt
fmdbmix_relativeMaxDatetime.fmdb_maxRelativeAmount=Versatz zum aktuellen Datum
fmdbmix_relativeMaxDatetime.fmdb_maxRelativeAmount.ui.tooltip=Vorzeichenbehaftete Anzahl von Einheiten, die zum aktuellen Datum addiert wird, um den maximalen w\u00e4hlbaren Zeitpunkt zu erhalten. <b>Beispiele:</b> <i>-18 Jahre h\u00e4lt Daten mindestens 18 Jahre in der Vergangenheit (Altersgrenze); +30 Tage erlaubt h\u00f6chstens 30 Tage im Voraus (Buchungsfenster)</i>.<br/><b>Muss nach (oder gleich) dem Minimum liegen</b> \u2014 vertauschte Grenzen lassen kein w\u00e4hlbares Datum \u00fcbrig.
