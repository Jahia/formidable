fmdbmix_relativeMinDatetime.fmdb_minRelativeAmount.ui.tooltip=Vorzeichenbehaftete Anzahl von Einheiten, die zum aktuellen Datum addiert wird, um den minimalen w\u00e4hlbaren Zeitpunkt zu erhalten. <b>Beispiele:</b> <i>-18 Jahre h\u00e4lt Daten mindestens 18 Jahre in der Vergangenheit (Altersgrenze); +30 Tage erlaubt h\u00f6chstens 30 Tage im Voraus (Buchungsfenster)</i>.<br/><b>Muss vor (oder gleich) dem Maximum liegen</b> \u2014 vertauschte Grenzen lassen kein w\u00e4hlbares Datum \u00fcbrig.
