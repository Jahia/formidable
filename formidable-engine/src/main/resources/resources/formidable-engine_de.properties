fmdbmix_actionConfig=Formidable - Formularaktionen
fmdbmix_formAction=Formularaktion

fmdb_save2jcrAction=Im JCR speichern
fmdb_save2jcrAction.ui.tooltip=Speichert die \u00fcbermittelten Formulardaten als Unterknoten unter einem festgelegten JCR-Pfad.

fmdb_forwardAction=Daten weiterleiten
fmdb_forwardAction.ui.tooltip=Leitet die vollst\u00e4ndigen Formulardaten (einschlie\u00dflich Dateien) an einen Drittanbieter-Endpunkt weiter (multipart/form-data). CAPTCHA-Token-Felder werden vor der Weiterleitung entfernt.
fmdb_forwardAction.targetId=Weiterleitungsziel
fmdb_forwardAction.targetId.ui.tooltip=Die Liste der verf\u00fcgbaren Ziele wird von einem Administrator verwaltet.

fmdb_emailNotificationAction=E-Mail-Benachrichtigung
fmdb_emailNotificationAction.ui.tooltip=Sendet nach einer erfolgreichen Formular\u00fcbermittlung eine E-Mail-Benachrichtigung. Betreff und Text unterst\u00fctzen die ${fieldName}-Interpolation.
fmdb_emailNotificationAction.to=Empf\u00e4nger (To)
fmdb_emailNotificationAction.to.ui.tooltip=E-Mail-Adresse des Empf\u00e4ngers.<br/><b>Beispiel:</b> <i>contact@example.com</i>.
fmdb_emailNotificationAction.from=Absender (From)
fmdb_emailNotificationAction.from.ui.tooltip=Als Absender angezeigte E-Mail-Adresse.<br/><b>Beispiel:</b> <i>no-reply@example.com</i>.
fmdb_emailNotificationAction.subject=Betreff
fmdb_emailNotificationAction.subject.ui.tooltip=Betreffzeile der E-Mail. Unterst\u00fctzt die ${fieldName}-Interpolation.<br/><b>Beispiel:</b> <i>Neue Nachricht von ${firstname}</i>.
fmdb_emailNotificationAction.templateMessage=Nachrichtentext
fmdb_emailNotificationAction.templateMessage.ui.tooltip=Text der E-Mail. Unterst\u00fctzt die ${fieldName}-Interpolation.<br/><b>Beispiel:</b> <i>Name: ${firstname} ${lastname}\nNachricht: ${message}</i>.

fmdb_emailContentAction=Formularinhalt per E-Mail
fmdb_emailContentAction.ui.tooltip=Sendet den \u00fcbermittelten Formularinhalt per E-Mail. Der Betreff verwendet den Titel des \u00fcbermittelten Formulars; hochgeladene Dateien k\u00f6nnen optional als Anh\u00e4nge beigef\u00fcgt werden.
fmdb_emailContentAction.to=Empf\u00e4nger (To)
fmdb_emailContentAction.to.ui.tooltip=E-Mail-Adresse des Empf\u00e4ngers.<br/><b>Beispiel:</b> <i>contact@example.com</i>.
fmdb_emailContentAction.from=Absender (From)
fmdb_emailContentAction.from.ui.tooltip=Als Absender angezeigte E-Mail-Adresse.<br/><b>Beispiel:</b> <i>no-reply@example.com</i>.
fmdb_emailContentAction.attachFiles=Hochgeladene Dateien anh\u00e4ngen
fmdb_emailContentAction.attachFiles.ui.tooltip=H\u00e4ngt validierte hochgeladene Dateien an die E-Mail an, wenn das Formular Datei-Eingabefelder enth\u00e4lt.
fmdb_emailContentAction.maxAttachmentSizeMb=Maximale Anhangsgr\u00f6\u00dfe (MB)
fmdb_emailContentAction.maxAttachmentSizeMb.ui.tooltip=Maximal zul\u00e4ssige Gr\u00f6\u00dfe pro angeh\u00e4ngter Datei f\u00fcr diese E-Mail-Aktion.<br/><b>Hinweis:</b> <i>Die effektive Grenze kann das global konfigurierte Upload-Limit des Moduls nie \u00fcberschreiten.</i><br/><b>Beispiel:</b> <i>5</i>.
fmdb.section.logic=Logik
fmdbmix_formLogicElement=Bedingte Logik
fmdbmix_formLogicElement.ui.tooltip=Definieren Sie Regeln, die steuern, wann dieses Feld abh\u00e4ngig vom Wert anderer Felder sichtbar ist. Das Feld ist sichtbar, wenn alle Regeln zutreffen, andernfalls ausgeblendet. Ohne Regel ist das Feld immer sichtbar.
fmdbmix_formLogicElement.logics=Regeln
fmdbmix_formLogicElement.logics.ui.tooltip=Definieren Sie Regeln, die steuern, wann dieses Feld abh\u00e4ngig vom Wert anderer Felder sichtbar ist. Nur Auswahl-, Radio-, Checkbox- und Datumsfelder, die vor diesem Feld stehen, kommen als Quellfelder infrage. Das Feld ist sichtbar, wenn alle konfigurierten Regeln zutreffen, andernfalls ausgeblendet. Ohne Regel ist das Feld immer sichtbar.

fmdbmix_captcha=CAPTCHA
fmdbmix_captcha.ui.tooltip=Aktiviert den CAPTCHA-Schutz f\u00fcr dieses Formular. Das Widget wird automatisch anhand der globalen Konfiguration (org.jahia.modules.formidable.captcha.cfg) eingebunden. Das Token wird immer serverseitig gepr\u00fcft.

fmdbmix_optionsSource=Optionen
fmdbmix_optionsSource.fmdb_optionsMode=Herkunft der Optionen
fmdbmix_optionsSource.fmdb_optionsMode.ui.tooltip=Legen Sie fest, wie die Optionsliste dieses Feldes gef\u00fcllt wird: manuell eingegeben oder von einer Optionsquelle bereitgestellt.
fmdbmix_manualOptions=Manuelle Optionen
fmdbmix_manualOptions.fmdb_options=Optionen
fmdbmix_manualOptions.fmdb_options.ui.tooltip=Liste der w\u00e4hlbaren Optionen.<br/><br/><b>Jede Zeile enth\u00e4lt:</b><br/>- <b>Schalter</b>: wenn aktiviert, ist die Option standardm\u00e4\u00dfig ausgew\u00e4hlt<br/>- <b>Erstes Feld</b>: an den Server gesendeter Wert<br/>- <b>Zweites Feld</b>: dem Benutzer angezeigte Beschriftung.<br/><br/><b>Sprachen</b>: Optionen werden in der Standardsprache der Website angelegt; in den anderen Sprachen werden nur die Beschriftungen \u00fcbersetzt (Werte, Reihenfolge und Vorauswahl sind gemeinsam und werden beim Speichern an der Standardsprache ausgerichtet).
fmdbmix_sourcedOptions=Optionen aus einer Drittanbieter-Quelle
fmdbmix_sourcedOptions.fmdb_optionsSourceKey=Quelle
fmdbmix_sourcedOptions.fmdb_optionsSourceKey.ui.tooltip=Die Optionsquelle, die die Liste zum Anzeigezeitpunkt liefert. Quellen werden von Ihrem Administrator deklariert.
fmdbmix_categoryOptions=Optionen aus Kategorien
fmdbmix_categoryOptions.fmdb_optionsRootCategory=Wurzelkategorie
fmdbmix_categoryOptions.fmdb_optionsRootCategory.ui.tooltip=Die Optionen dieses Feldes sind die Kategorien direkt unterhalb der gew\u00e4hlten Kategorie, in der Sprache des angezeigten Formulars. In der Live-Ansicht erscheinen nur ver\u00f6ffentlichte Kategorien.
fmdbmix_contentOptions=Optionen aus Website-Inhalten
fmdbmix_contentOptions.fmdb_optionsRootNode=Wurzelinhalt
fmdbmix_contentOptions.fmdb_optionsRootNode.ui.tooltip=Die Optionen dieses Feldes sind die Inhalte des konfigurierten Typs unterhalb dieses Knotens. In der Live-Ansicht erscheinen nur ver\u00f6ffentlichte, f\u00fcr den Besucher lesbare Inhalte.
fmdbmix_contentOptions.fmdb_optionsNodeType=Inhaltstyp
fmdbmix_contentOptions.fmdb_optionsNodeType.ui.tooltip=Technischer Name des aufzulistenden Inhaltstyps (zum Beispiel mymodule:agency). Nur Inhalte dieses Typs unterhalb des Wurzelinhalts werden zu Optionen.
fmdbmix_contentOptions.fmdb_optionsNodeType.capExceeded=mehr als {0} Optionen gefunden: schr\u00e4nken Sie den Wurzelinhalt ein oder bitten Sie einen Administrator, das Limit zu erh\u00f6hen
fmdbmix_dateBounds=Datumsgrenzen
fmdbmix_dateBounds.fmdb_minBoundMode=Herkunft des Minimaldatums
fmdbmix_dateBounds.fmdb_minBoundMode.ui.tooltip=Woher das fr\u00fcheste w\u00e4hlbare Datum stammt: keines, ein im Kalender gew\u00e4hltes festes Datum oder das aktuelle Datum \u2014 der Tag, an dem der Besucher das Formular absendet.<br/><b>Verwendung des aktuellen Datums:</b> <i>Termin- oder Reservierungsdaten, die nicht in der Vergangenheit liegen d\u00fcrfen</i>.
fmdbmix_dateBounds.fmdb_maxBoundMode=Herkunft des Maximaldatums
fmdbmix_dateBounds.fmdb_maxBoundMode.ui.tooltip=Woher das sp\u00e4teste w\u00e4hlbare Datum stammt: keines, ein im Kalender gew\u00e4hltes festes Datum oder das aktuelle Datum \u2014 der Tag, an dem der Besucher das Formular absendet.<br/><b>Verwendung des aktuellen Datums:</b> <i>Geburtsdaten oder \u201eereignet am\u201c-Daten, die nicht in der Zukunft liegen d\u00fcrfen</i>.
fmdbmix_fixedMinDate=Festes Minimaldatum
fmdbmix_fixedMinDate.min=Minimaldatum
fmdbmix_fixedMinDate.min.ui.tooltip=Das fr\u00fcheste w\u00e4hlbare Datum.<br/><b>Validierung:</b> Verhindert die Auswahl von Daten vor diesem Wert.<br/><b>Muss vor (oder gleich) dem Maximum liegen</b> \u2014 vertauschte Grenzen lassen kein w\u00e4hlbares Datum \u00fcbrig.
fmdbmix_fixedMaxDate=Festes Maximaldatum
fmdbmix_fixedMaxDate.max=Maximaldatum
fmdbmix_fixedMaxDate.max.ui.tooltip=Das sp\u00e4teste w\u00e4hlbare Datum.<br/><b>Validierung:</b> Verhindert die Auswahl von Daten nach diesem Wert.<br/><b>Muss nach (oder gleich) dem Minimum liegen</b> \u2014 vertauschte Grenzen lassen kein w\u00e4hlbares Datum \u00fcbrig.
fmdbmix_relativeMinDate=Relatives Minimaldatum
fmdbmix_relativeMinDate.fmdb_minRelativeAmount=Versatz zum aktuellen Datum
fmdbmix_relativeMinDate.fmdb_minRelativeAmount.ui.tooltip=Vorzeichenbehaftete Anzahl von Einheiten, die zum aktuellen Datum addiert wird, um das minimale w\u00e4hlbare Datum zu erhalten. <b>Beispiele:</b> <i>-18 Jahre h\u00e4lt Daten mindestens 18 Jahre in der Vergangenheit (Altersgrenze); +30 Tage erlaubt h\u00f6chstens 30 Tage im Voraus (Buchungsfenster)</i>.<br/><b>Muss vor (oder gleich) dem Maximum liegen</b> \u2014 vertauschte Grenzen lassen kein w\u00e4hlbares Datum \u00fcbrig.
fmdbmix_relativeMinDate.fmdb_minRelativeUnit=Einheit des Versatzes
fmdbmix_relativeMinDate.fmdb_minRelativeUnit.ui.tooltip=Tage, Monate oder Jahre. Monats- und Jahresarithmetik wird auf das Ende k\u00fcrzerer Monate begrenzt (31. Januar + 1 Monat = 28. oder 29. Februar).
fmdbmix_relativeMaxDate=Relatives Maximaldatum
fmdbmix_relativeMaxDate.fmdb_maxRelativeAmount=Versatz zum aktuellen Datum
fmdbmix_relativeMaxDate.fmdb_maxRelativeAmount.ui.tooltip=Vorzeichenbehaftete Anzahl von Einheiten, die zum aktuellen Datum addiert wird, um das maximale w\u00e4hlbare Datum zu erhalten. <b>Beispiele:</b> <i>-18 Jahre h\u00e4lt Daten mindestens 18 Jahre in der Vergangenheit (Altersgrenze); +30 Tage erlaubt h\u00f6chstens 30 Tage im Voraus (Buchungsfenster)</i>.<br/><b>Muss nach (oder gleich) dem Minimum liegen</b> \u2014 vertauschte Grenzen lassen kein w\u00e4hlbares Datum \u00fcbrig.
fmdbmix_relativeMaxDate.fmdb_maxRelativeUnit=Einheit des Versatzes
fmdbmix_relativeMaxDate.fmdb_maxRelativeUnit.ui.tooltip=Tage, Monate oder Jahre. Monats- und Jahresarithmetik wird auf das Ende k\u00fcrzerer Monate begrenzt (31. Januar + 1 Monat = 28. oder 29. Februar).
fmdbmix_datetimeBounds=Zeitpunktgrenzen
fmdbmix_datetimeBounds.fmdb_minBoundMode=Herkunft des minimalen Zeitpunkts
fmdbmix_datetimeBounds.fmdb_minBoundMode.ui.tooltip=Woher der fr\u00fcheste w\u00e4hlbare Zeitpunkt stammt: keiner, ein fester Zeitpunkt oder das aktuelle Datum \u2014 ab Tagesbeginn des Tages, an dem der Besucher das Formular absendet.<br/><b>Verwendung des aktuellen Datums:</b> <i>Termin- oder Reservierungsslots, die nicht in der Vergangenheit liegen d\u00fcrfen</i>.
fmdbmix_datetimeBounds.fmdb_maxBoundMode=Herkunft des maximalen Zeitpunkts
fmdbmix_datetimeBounds.fmdb_maxBoundMode.ui.tooltip=Woher der sp\u00e4teste w\u00e4hlbare Zeitpunkt stammt: keiner, ein fester Zeitpunkt oder das aktuelle Datum \u2014 bis zum Tagesende des Tages, an dem der Besucher das Formular absendet.<br/><b>Verwendung des aktuellen Datums:</b> <i>Ereigniszeitpunkte, die nicht in der Zukunft liegen d\u00fcrfen</i>.
fmdbmix_fixedMinDatetime=Fester minimaler Zeitpunkt
fmdbmix_fixedMinDatetime.min=Minimaler Zeitpunkt
fmdbmix_fixedMinDatetime.min.ui.tooltip=Der fr\u00fcheste w\u00e4hlbare Zeitpunkt.<br/><b>Validierung:</b> Verhindert die Auswahl von Zeitpunkten vor diesem Wert.<br/><b>Muss vor (oder gleich) dem Maximum liegen</b> \u2014 vertauschte Grenzen lassen kein w\u00e4hlbares Datum \u00fcbrig.
