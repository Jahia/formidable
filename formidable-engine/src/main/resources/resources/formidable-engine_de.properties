fmdbmix_fixedMaxDatetime.max.ui.tooltip=Der sp\u00e4teste w\u00e4hlbare Zeitpunkt.<br/><b>Validierung:</b> Verhindert die Auswahl von Zeitpunkten nach diesem Wert.<br/><b>Muss nach (oder gleich) dem Minimum liegen</b> \u2014 vertauschte Grenzen lassen kein w\u00e4hlbares Datum \u00fcbrig.
