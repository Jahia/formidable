- karafCommand: "bundle:list"
- addMavenRepository: 'https://devtools.jahia.com/nexus/content/groups/public/@snapshots@noreleases@id=JahiaPublicSnapshots'
- installBundle:
    - 'mvn:org.jahia.modules/content-integrity'
    - 'mvn:org.jahia.modules/jcontent'
  autoStart: true
  uninstallPreviousVersion: true
# The scheduled run of formidable-quarantine is off on the test lab: a spec moves a held submission with "run now"
# alone. Spec 91 turns it on for its own test, and off again.
- editConfiguration: "org.jahia.modules.formidable.quarantine.run"
  properties:
    periodSeconds: "0"
