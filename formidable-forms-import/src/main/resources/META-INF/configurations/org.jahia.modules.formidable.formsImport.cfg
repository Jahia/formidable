# default configuration - deployed once, then kept as edited.
# Formidable - Forms import (PID org.jahia.modules.formidable.formsImport). The one configuration file of the
# Forms import module, read as it stands: unlike the engine's theme files, a missing setting is not written back. Jahia copies
# each file to digital-factory-data/karaf/etc the first time the module starts without it there, and the line
# above tells Jahia never to overwrite that copy: edit it, or use the provisioning API (editConfiguration), your
# changes are kept. Avoid the Felix Web Console for these PIDs: it rewrites the file in a typed syntax
# (L"5", quoted strings) a .cfg file does not read back. Every value below is the built-in default.
#
# The import of Jahia Forms forms and results from the Results page (docs/administration/forms-import.md).
# The Import button shows to the administrators of the sites the module is enabled on, as any module is
# enabled on a site: no setting turns it on. maxFileSizeMb is the largest export file the dialog accepts.
maxFileSizeMb=200
