# Labels of the jExperience integration (Java module: ISO-8859-1, non-ASCII escaped as \uXXXX).
# Author-facing wording speaks of the visitor profile, never of jCustomer.
fmdb.section.jexperience=jExperience

fmdbmix_jExperienceProfileMapping=Visitor profile mapping
fmdbmix_jExperienceProfileMapping.ui.tooltip=Switch on to write this field's value into the visitor's profile when the form is submitted, and to prefill it from that profile.
fmdbmix_jExperienceProfileMapping.jExperienceProfileProperty=Visitor profile property
fmdbmix_jExperienceProfileMapping.jExperienceProfileProperty.ui.tooltip=The visitor profile property this field maps to. Only the properties matching the field's type and cardinality are listed.
fmdbmix_jExperienceProfileMapping.jExperiencePrefillFromProfile=Prefill from the visitor profile
fmdbmix_jExperienceProfileMapping.jExperiencePrefillFromProfile.ui.tooltip=When the visitor's profile already holds a value, the field is filled with it when the page opens.
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy=When the profile already has a value
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.ui.tooltip=Whether a submitted value replaces a value already present in the visitor's profile, or is written only when the profile has none.
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.alwaysSet=Replace it with the submitted value
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.setIfMissing=Keep it, write only when missing

fmdbmix_jExperienceForm=Identifier in jExperience
fmdbmix_jExperienceForm.ui.tooltip=How jExperience names this form: the target of its submission event and the form of its mapping rule.
fmdbmix_jExperienceForm.jExperienceIdentifier=Form identifier
fmdbmix_jExperienceForm.jExperienceIdentifier.ui.tooltip=Copy this identifier into a jExperience goal or segment that should count this form's submissions.

formidableJExperienceProfileProperties.none=No visitor profile property matches this field's type yet
formidableJExperienceProfileProperties.unavailable=The visitor profile properties cannot be listed right now: jExperience is not connected
