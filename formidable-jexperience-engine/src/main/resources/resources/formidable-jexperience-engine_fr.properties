fmdb.section.jexperience=jExperience

fmdbmix_jExperienceProfileMapping=Correspondance avec le profil visiteur
fmdbmix_jExperienceProfileMapping.ui.tooltip=Activez pour \u00e9crire la valeur de ce champ dans le profil du visiteur \u00e0 la soumission du formulaire, et pour le pr\u00e9-remplir depuis ce profil.
fmdbmix_jExperienceProfileMapping.jExperienceProfileProperty=Propri\u00e9t\u00e9 du profil visiteur
fmdbmix_jExperienceProfileMapping.jExperienceProfileProperty.ui.tooltip=<strong>Note :</strong> une propri\u00e9t\u00e9 cr\u00e9\u00e9e dans jExperience \u00e0 l'instant peut mettre jusqu'\u00e0 <strong>1 min</strong> \u00e0 appara\u00eetre ici \u2014 fermez et rouvrez le champ.<br/>La propri\u00e9t\u00e9 du profil visiteur \u00e0 laquelle ce champ correspond. Seules les propri\u00e9t\u00e9s compatibles avec le type et la cardinalit\u00e9 du champ sont propos\u00e9es.
fmdbmix_jExperienceProfileMapping.jExperiencePrefillFromProfile=Pr\u00e9-remplir depuis le profil visiteur
fmdbmix_jExperienceProfileMapping.jExperiencePrefillFromProfile.ui.tooltip=Quand le profil du visiteur contient d\u00e9j\u00e0 une valeur, le champ est rempli avec elle \u00e0 l'ouverture de la page.
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy=Quand le profil a d\u00e9j\u00e0 une valeur
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.ui.tooltip=Une valeur soumise remplace-t-elle une valeur d\u00e9j\u00e0 pr\u00e9sente dans le profil du visiteur, ou n'est-elle \u00e9crite que si le profil n'en a pas.
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.alwaysSet=La remplacer par la valeur soumise
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.setIfMissing=La conserver, n'\u00e9crire que si elle manque

fmdbmix_jExperienceForm=Identifiant dans jExperience
fmdbmix_jExperienceForm.ui.tooltip=Comment jExperience nomme ce formulaire : la cible de son \u00e9v\u00e9nement de soumission et le formulaire de sa r\u00e8gle de correspondance.
fmdbmix_jExperienceForm.jExperienceIdentifier=Identifiant du formulaire
fmdbmix_jExperienceForm.jExperienceIdentifier.ui.tooltip=Copiez cet identifiant dans un objectif ou un segment jExperience qui doit compter les soumissions de ce formulaire.

