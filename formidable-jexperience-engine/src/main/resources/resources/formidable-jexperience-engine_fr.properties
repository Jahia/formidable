# Libell\u00e9s de l'int\u00e9gration jExperience (module Java : ISO-8859-1, non-ASCII \u00e9chapp\u00e9 en \uXXXX).
# Le vocabulaire de l'auteur parle du profil visiteur, jamais de jCustomer.
fmdb.section.jexperience=jExperience

fmdbmix_jExperienceSensitiveField=Confidentialit\u00e9
fmdbmix_jExperienceSensitiveField.jExperienceSensitive=Ce champ est sensible
fmdbmix_jExperienceSensitiveField.jExperienceSensitive.ui.tooltip=Activez si la valeur de ce champ ne doit jamais quitter le site : elle est exclue de ce que la soumission envoie \u00e0 jExperience, et le champ ne peut pas correspondre \u00e0 une propri\u00e9t\u00e9 du profil visiteur. Les soumissions cessent de la transporter d\u00e8s l'enregistrement, sans attendre une publication.

fmdbmix_jExperienceProfileMapping=Correspondance avec le profil visiteur
fmdbmix_jExperienceProfileMapping.ui.tooltip=Activez pour \u00e9crire la valeur de ce champ dans le profil du visiteur \u00e0 la soumission du formulaire.
fmdbmix_jExperienceProfileMapping.jExperienceProfileProperty=Propri\u00e9t\u00e9 du profil visiteur
fmdbmix_jExperienceProfileMapping.jExperienceProfileProperty.ui.tooltip=<strong>Note :</strong> une propri\u00e9t\u00e9 cr\u00e9\u00e9e dans jExperience \u00e0 l'instant peut mettre jusqu'\u00e0 <strong>1 min</strong> \u00e0 appara\u00eetre ici \u2014 fermez et rouvrez le champ.<br/>La propri\u00e9t\u00e9 du profil visiteur \u00e0 laquelle ce champ correspond. Seules les propri\u00e9t\u00e9s compatibles avec le type et la cardinalit\u00e9 du champ sont propos\u00e9es.
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy=Quand le profil visiteur a d\u00e9j\u00e0 une valeur
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.ui.tooltip=Choisissez si une valeur soumise remplace la valeur d\u00e9j\u00e0 pr\u00e9sente dans le profil du visiteur, ou si elle n'est \u00e9crite que lorsque le profil n'en a pas.
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.alwaysSet=La remplacer par la valeur soumise
fmdbmix_jExperienceProfileMapping.jExperienceSetStrategy.setIfMissing=La conserver, n'\u00e9crire que si elle manque

fmdbmix_jExperiencePrefill=Pr\u00e9-remplir depuis le profil visiteur
fmdbmix_jExperiencePrefill.ui.tooltip=Activez pour remplir ce champ, \u00e0 l'ouverture de la page, avec la valeur que le profil du visiteur a d\u00e9j\u00e0 pour la propri\u00e9t\u00e9 mapp\u00e9e. Champs vides seulement, sauf si l'option ci-dessous en d\u00e9cide autrement. N\u00e9cessite le mapping ci-dessus, activ\u00e9 avec une propri\u00e9t\u00e9 : sans lui, cet interrupteur n'a pas d'effet.
fmdbmix_jExperiencePrefill.jExperiencePrefillOverridesDefault=Remplacer la valeur par d\u00e9faut du champ
fmdbmix_jExperiencePrefill.jExperiencePrefillOverridesDefault.ui.tooltip=D\u00e9coch\u00e9e, une valeur par d\u00e9faut que vous avez donn\u00e9e au champ la garde et le profil ne remplit le champ que s'il est vide. Une valeur saisie par le visiteur n'est jamais remplac\u00e9e.

formidableJExperienceProfileProperties.kept=Correspondance actuelle, laiss\u00e9e inchang\u00e9e car les propri\u00e9t\u00e9s du profil visiteur ne peuvent pas \u00eatre list\u00e9es pour le moment (jExperience n'est pas connect\u00e9)
formidableJExperienceProfileProperties.sensitive=Ce champ est marqu\u00e9 comme sensible, il ne peut pas correspondre \u00e0 une propri\u00e9t\u00e9 du profil visiteur
formidableJExperienceProfileProperties.none=Aucune propri\u00e9t\u00e9 du profil visiteur ne correspond encore au type de ce champ
formidableJExperienceProfileProperties.unavailable=Les propri\u00e9t\u00e9s du profil visiteur ne peuvent pas \u00eatre list\u00e9es pour le moment : jExperience n'est pas connect\u00e9
