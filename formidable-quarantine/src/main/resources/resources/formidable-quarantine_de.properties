fmdbqmix_quarantinePolicy=Quarant\u00e4ne-Richtlinie
fmdbqmix_quarantinePolicy.ui.tooltip=Was die Quarant\u00e4ne mit einer \u00dcbermittlung macht, deren Datei eine Pr\u00fcfung abgelehnt hat, und der Scanstatus, den die Aktionen nach Freigabe erhalten. Ohne diese Richtlinie wird eine solche \u00dcbermittlung abgelehnt. Die Richtlinie gilt nur, solange das Formular seine Uploads in Quarant\u00e4ne h\u00e4lt.
fmdbqmix_quarantinePolicy.onFail=Wenn eine Pr\u00fcfung eine Datei ablehnt
fmdbqmix_quarantinePolicy.onFail.ui.tooltip=Die \u00dcbermittlung ablehnen: keine Aktion nach Freigabe l\u00e4uft, und ihre Werte und Dateien werden gel\u00f6scht. Oder die Dateien l\u00f6schen und die Werte freigeben: die Aktionen nach Freigabe laufen nur mit den Werten und dem fehlgeschlagenen Scanstatus. Ein Verwalter, der eine \u00dcbermittlung ablehnt, macht dasselbe, solange noch keine Aktion nach Freigabe gelaufen ist.
fmdbqmix_quarantinePolicy.onFail.reject=Die \u00dcbermittlung ablehnen
fmdbqmix_quarantinePolicy.onFail.releaseValues=Die Dateien l\u00f6schen und die Werte freigeben
fmdbqmix_quarantinePolicy.scanStatusName=Name des Scanstatus
fmdbqmix_quarantinePolicy.scanStatusName.ui.tooltip=Der Name des Werts, den die Quarant\u00e4ne den Werten der Aktionen nach Freigabe hinzuf\u00fcgt, zum Beispiel documentScanStatus: ein Buchstabe, dann bis zu 63 Buchstaben, Ziffern, _ oder -. Leer lassen, um keinen hinzuzuf\u00fcgen. Kein Feld des Formulars darf diesen Namen tragen: die Freigabe eines solchen Formulars h\u00e4lt zur Pr\u00fcfung an.
fmdbqmix_quarantinePolicy.scanStatusClean=Scanstatus, wenn die Dateien freigegeben werden
fmdbqmix_quarantinePolicy.scanStatusClean.ui.tooltip=Der Wert des Scanstatus, wenn jede Pr\u00fcfung die Dateien akzeptiert hat oder ein Verwalter sie freigegeben hat.
fmdbqmix_quarantinePolicy.scanStatusFailed=Scanstatus, wenn nur die Werte freigegeben werden
fmdbqmix_quarantinePolicy.scanStatusFailed.ui.tooltip=Der Wert des Scanstatus, wenn eine Pr\u00fcfung eine Datei abgelehnt hat oder ein Verwalter die \u00dcbermittlung abgelehnt hat und die Werte ohne Datei freigegeben werden.
fmdbqmix_quarantinePolicy.showValues=Die Werte den Verwaltern zeigen
fmdbqmix_quarantinePolicy.showValues.ui.tooltip=Die Werte einer zur\u00fcckgehaltenen \u00dcbermittlung den Verwaltern der Quarant\u00e4ne zeigen. Sensible Werte werden nie gezeigt.
