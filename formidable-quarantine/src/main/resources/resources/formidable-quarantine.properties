fmdbqmix_quarantineSite=Quarantine of the uploads
fmdbqmix_quarantineSite.retentionDays=Retention of the finished submissions (days)
fmdbqmix_quarantineSite.retentionDays.ui.tooltip=The number of days a completed or rejected held submission of this site is kept before it is purged. It can only lower the retention of the platform: a higher value is ignored. Leave it empty to keep the retention of the platform.

fmdbqmix_quarantinePolicy=Quarantine policy
fmdbqmix_quarantinePolicy.ui.tooltip=What the quarantine does with a submission whose file a check failed, and the scan status that the actions after release receive. Without this policy, such a submission is rejected. The policy applies only while the switch "Hold uploads in quarantine" is on.
fmdbqmix_quarantinePolicy.onFail=When a check fails a file
fmdbqmix_quarantinePolicy.onFail.ui.tooltip=Reject the submission: no action after release runs, and its values and files are deleted. Or delete the files and release the values: the actions after release run with the values alone and the failed scan status. A manager who rejects a submission does the same, as long as no action after release has run.
fmdbqmix_quarantinePolicy.onFail.reject=Reject the submission
fmdbqmix_quarantinePolicy.onFail.releaseValues=Delete the files and release the values
fmdbqmix_quarantinePolicy.scanStatusName=Name of the scan status
fmdbqmix_quarantinePolicy.scanStatusName.ui.tooltip=The name of the value that the quarantine adds to the values of the actions after release, such as documentScanStatus: a letter, then up to 63 letters, digits, _ or -. Leave it empty to add none. No field of the form may have this name: the release of such a form stops at review.
fmdbqmix_quarantinePolicy.scanStatusClean=Scan status when the files are released
fmdbqmix_quarantinePolicy.scanStatusClean.ui.tooltip=The value of the scan status when every check passed the files, or a manager released them.
fmdbqmix_quarantinePolicy.scanStatusFailed=Scan status when the values are released alone
fmdbqmix_quarantinePolicy.scanStatusFailed.ui.tooltip=The value of the scan status when a check failed a file, or a manager rejected the submission, and the values are released with no file.
fmdbqmix_quarantinePolicy.showValues=Show the values to the managers
fmdbqmix_quarantinePolicy.showValues.ui.tooltip=Show the values of a held submission to the quarantine managers. Sensitive values are never shown.

fmdbq_allowListCheck=Allowed file types
fmdbq_allowListCheck.ui.tooltip=Passes a file only when both its extension and its MIME type are on the lists, and rejects the submission otherwise. It reads the name and the type of the file, never its content: an allowed file is not scanned. Put a scanner after this check.
fmdbq_allowListCheck.extensions=Allowed extensions
fmdbq_allowListCheck.extensions.ui.tooltip=One extension per value, such as pdf or png. Case does not matter. At least one value is required.
fmdbq_allowListCheck.mimeTypes=Allowed MIME types
fmdbq_allowListCheck.mimeTypes.ui.tooltip=One MIME type per value, such as application/pdf. Case and parameters such as charset do not matter, in a value and in the type of a file. At least one value is required.
