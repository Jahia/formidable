fmdbqmix_quarantinePolicy=Politique de quarantaine
fmdbqmix_quarantinePolicy.ui.tooltip=Ce que fait la quarantaine d'une soumission dont une v\u00e9rification a refus\u00e9 un fichier, et le statut d'analyse que re\u00e7oivent les actions apr\u00e8s lib\u00e9ration. Sans cette politique, une telle soumission est rejet\u00e9e. La politique ne s'applique que si le formulaire met ses fichiers en quarantaine.
fmdbqmix_quarantinePolicy.onFail=Quand une v\u00e9rification refuse un fichier
fmdbqmix_quarantinePolicy.onFail.ui.tooltip=Rejeter la soumission : aucune action apr\u00e8s lib\u00e9ration ne s'ex\u00e9cute, et ses valeurs et ses fichiers sont supprim\u00e9s. Ou supprimer les fichiers et lib\u00e9rer les valeurs : les actions apr\u00e8s lib\u00e9ration s'ex\u00e9cutent avec les valeurs seules et le statut d'analyse en \u00e9chec. Un gestionnaire qui rejette une soumission fait de m\u00eame, tant qu'aucune action apr\u00e8s lib\u00e9ration ne s'est ex\u00e9cut\u00e9e.
fmdbqmix_quarantinePolicy.onFail.reject=Rejeter la soumission
fmdbqmix_quarantinePolicy.onFail.releaseValues=Supprimer les fichiers et lib\u00e9rer les valeurs
fmdbqmix_quarantinePolicy.scanStatusName=Nom du statut d'analyse
fmdbqmix_quarantinePolicy.scanStatusName.ui.tooltip=Le nom de la valeur que la quarantaine ajoute aux valeurs des actions apr\u00e8s lib\u00e9ration, par exemple documentScanStatus : une lettre, puis jusqu'\u00e0 63 lettres, chiffres, _ ou -. Laissez-le vide pour n'en ajouter aucune. Aucun champ du formulaire ne doit porter ce nom : la lib\u00e9ration d'un tel formulaire s'arr\u00eate en revue.
fmdbqmix_quarantinePolicy.scanStatusClean=Statut d'analyse quand les fichiers sont lib\u00e9r\u00e9s
fmdbqmix_quarantinePolicy.scanStatusClean.ui.tooltip=La valeur du statut d'analyse quand chaque v\u00e9rification a accept\u00e9 les fichiers, ou qu'un gestionnaire les a lib\u00e9r\u00e9s.
fmdbqmix_quarantinePolicy.scanStatusFailed=Statut d'analyse quand les valeurs sont lib\u00e9r\u00e9es seules
fmdbqmix_quarantinePolicy.scanStatusFailed.ui.tooltip=La valeur du statut d'analyse quand une v\u00e9rification a refus\u00e9 un fichier, ou qu'un gestionnaire a rejet\u00e9 la soumission, et que les valeurs sont lib\u00e9r\u00e9es sans fichier.
fmdbqmix_quarantinePolicy.showValues=Montrer les valeurs aux gestionnaires
fmdbqmix_quarantinePolicy.showValues.ui.tooltip=Montrer les valeurs d'une soumission retenue aux gestionnaires de la quarantaine. Les valeurs sensibles ne sont jamais montr\u00e9es.
