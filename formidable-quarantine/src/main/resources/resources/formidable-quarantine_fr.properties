fmdbq_allowListCheck=Types de fichiers autoris\u00e9s
fmdbq_allowListCheck.ui.tooltip=Laisse passer un fichier seulement si son extension et son type MIME sont tous deux dans les listes, et rejette la soumission sinon. Elle lit le nom et le type du fichier, jamais son contenu : un fichier autoris\u00e9 n'est pas analys\u00e9. Placez un antivirus apr\u00e8s cette v\u00e9rification.
fmdbq_allowListCheck.extensions=Extensions autoris\u00e9es
fmdbq_allowListCheck.extensions.ui.tooltip=Une extension par valeur, comme pdf ou png. La casse ne compte pas. Au moins une valeur est requise.
fmdbq_allowListCheck.mimeTypes=Types MIME autoris\u00e9s
fmdbq_allowListCheck.mimeTypes.ui.tooltip=Un type MIME par valeur, comme application/pdf. La casse et les param\u00e8tres comme charset ne comptent pas, dans une valeur comme dans le type d'un fichier. Au moins une valeur est requise.
