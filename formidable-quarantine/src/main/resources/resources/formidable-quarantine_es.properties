fmdbq_allowListCheck=Tipos de archivo permitidos
fmdbq_allowListCheck.ui.tooltip=Deja pasar un archivo solo si su extensi\u00f3n y su tipo MIME est\u00e1n ambos en las listas, y rechaza el env\u00edo en caso contrario. Lee el nombre y el tipo del archivo, nunca su contenido: un archivo permitido no se analiza. Coloque un antivirus despu\u00e9s de esta comprobaci\u00f3n.
fmdbq_allowListCheck.extensions=Extensiones permitidas
fmdbq_allowListCheck.extensions.ui.tooltip=Una extensi\u00f3n por valor, como pdf o png. May\u00fasculas y min\u00fasculas no importan. Una lista vac\u00eda no permite ning\u00fan archivo.
fmdbq_allowListCheck.mimeTypes=Tipos MIME permitidos
fmdbq_allowListCheck.mimeTypes.ui.tooltip=Un tipo MIME por valor, como application/pdf. May\u00fasculas, min\u00fasculas y par\u00e1metros no importan. Una lista vac\u00eda no permite ning\u00fan archivo.
