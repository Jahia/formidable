fmdbqmix_quarantinePolicy=Pol\u00edtica de cuarentena
fmdbqmix_quarantinePolicy.ui.tooltip=Lo que hace la cuarentena con un env\u00edo cuyo archivo rechaz\u00f3 una verificaci\u00f3n, y el estado de an\u00e1lisis que reciben las acciones tras la liberaci\u00f3n. Sin esta pol\u00edtica, ese env\u00edo se rechaza. La pol\u00edtica solo se aplica mientras el formulario retiene sus archivos en cuarentena.
fmdbqmix_quarantinePolicy.onFail=Cuando una verificaci\u00f3n rechaza un archivo
fmdbqmix_quarantinePolicy.onFail.ui.tooltip=Rechazar el env\u00edo: no se ejecuta ninguna acci\u00f3n tras la liberaci\u00f3n, y se eliminan sus valores y sus archivos. O eliminar los archivos y liberar los valores: las acciones tras la liberaci\u00f3n se ejecutan solo con los valores y el estado de an\u00e1lisis fallido. Un gestor que rechaza un env\u00edo hace lo mismo, mientras no se haya ejecutado ninguna acci\u00f3n tras la liberaci\u00f3n.
fmdbqmix_quarantinePolicy.onFail.reject=Rechazar el env\u00edo
fmdbqmix_quarantinePolicy.onFail.releaseValues=Eliminar los archivos y liberar los valores
fmdbqmix_quarantinePolicy.scanStatusName=Nombre del estado de an\u00e1lisis
fmdbqmix_quarantinePolicy.scanStatusName.ui.tooltip=El nombre del valor que la cuarentena a\u00f1ade a los valores de las acciones tras la liberaci\u00f3n, por ejemplo documentScanStatus: una letra y despu\u00e9s hasta 63 letras, cifras, _ o -. D\u00e9jelo vac\u00edo para no a\u00f1adir ninguno. Ning\u00fan campo del formulario puede tener este nombre: la liberaci\u00f3n de un formulario as\u00ed se detiene en revisi\u00f3n.
fmdbqmix_quarantinePolicy.scanStatusClean=Estado de an\u00e1lisis cuando se liberan los archivos
fmdbqmix_quarantinePolicy.scanStatusClean.ui.tooltip=El valor del estado de an\u00e1lisis cuando cada verificaci\u00f3n acept\u00f3 los archivos, o un gestor los liber\u00f3.
fmdbqmix_quarantinePolicy.scanStatusFailed=Estado de an\u00e1lisis cuando se liberan solo los valores
fmdbqmix_quarantinePolicy.scanStatusFailed.ui.tooltip=El valor del estado de an\u00e1lisis cuando una verificaci\u00f3n rechaz\u00f3 un archivo, o un gestor rechaz\u00f3 el env\u00edo, y los valores se liberan sin archivo.
fmdbqmix_quarantinePolicy.showValues=Mostrar los valores a los gestores
fmdbqmix_quarantinePolicy.showValues.ui.tooltip=Mostrar los valores de un env\u00edo retenido a los gestores de la cuarentena. Los valores sensibles no se muestran nunca.
