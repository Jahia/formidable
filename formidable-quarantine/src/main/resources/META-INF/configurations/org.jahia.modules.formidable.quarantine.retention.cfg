# default configuration - deployed once, then kept as edited.
# The retention of the completed and rejected held submissions of the quarantine.
# The retention runs on its own schedule on the processing server; a site can lower retentionDays in its settings.

# The number of days a completed or rejected held submission is kept after its last change.
retentionDays=30
# The period of the scheduled purge, in seconds: once a day. 0 turns the scheduled purge off.
periodSeconds=86400
