# default configuration - deployed once, then kept as edited.
# The run of the checks of the quarantine.

# Lift the refusal of a list where an in-process check reads a file before a remote check passed it.
allowInProcessFirst=false
# The delay after the first attempt, in seconds. It doubles at each attempt, up to the cap.
backoffInitialSeconds=60
backoffCapSeconds=3600
# The count after which the submission goes to review: the retryable failures of a check on a file until it
# answers a result, or the runs in a row that bring no new PASS.
maxAttempts=10
