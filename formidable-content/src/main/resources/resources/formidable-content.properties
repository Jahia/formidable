# Formidable Content - labels of the editor and sentences the visitor reads.
# Resource bundle of the module (resources.formidable-content); ASCII only, accents as \uXXXX escapes.

fmdbcnt_createContentAction=Create content
fmdbcnt_createContentAction.ui.tooltip=Creates a content node from the submission of a signed-in user: the form's fields fill the properties of a node of the chosen type, the uploaded files are stored and referenced by it, and both are published. Guests are refused. The content is written only in a folder the submitter can read, the one named by their group.
fmdbcnt_createContentAction.contentType=Content type
fmdbcnt_createContentAction.contentType.ui.tooltip=The node type to create, with its prefix (for example ctmd:submission). It must exist, not be abstract, and be allowed in the target folder.
fmdbcnt_createContentAction.parentFolder=Content folder
fmdbcnt_createContentAction.parentFolder.ui.tooltip=The folder the content is created in. With a group prefix, it is the folder that holds one subfolder per group. It must be published: the action reads it in the live workspace.
fmdbcnt_createContentAction.filesFolder=Files folder
fmdbcnt_createContentAction.filesFolder.ui.tooltip=The folder the uploaded files are stored in. With a group prefix, it holds the same subfolders as the content folder. Required as soon as an upload field is mapped.
fmdbcnt_createContentAction.groupPrefix=Group prefix
fmdbcnt_createContentAction.groupPrefix.ui.tooltip=Optional. When set, the groups of the submitter are searched for the one whose name starts with this prefix, and the rest of its name is the subfolder under the content folder and the files folder (prefix <i>orvane-supplier-</i> and group <i>orvane-supplier-northlight</i> give the subfolder <i>northlight</i>). The subfolders must already exist: they are never created. No matching group, several, or a missing subfolder refuse the submission.
fmdbcnt_createContentAction.titleField=Title field
fmdbcnt_createContentAction.titleField.ui.tooltip=The field whose value becomes the title of the content (jcr:title), in every language of the site. It also names the node.
fmdbcnt_createContentAction.fieldMappings=Field mappings
fmdbcnt_createContentAction.fieldMappings.ui.tooltip=One line per field: <i>formField=property</i>. The value is converted to the type of the property (text, whole number, decimal, true or false, date as yyyy-MM-dd; a multiple property takes every value of the field). An unknown property or a value that does not fit refuses the submission.
fmdbcnt_createContentAction.fileMappings=File mappings
fmdbcnt_createContentAction.fileMappings.ui.tooltip=One line per upload field: <i>fileField=property</i>. The files are stored in the files folder (unique, sanitized names; the size of an image is recorded) and the property, a reference to files, points to them.
fmdbcnt_createContentAction.fileMixin=File mixin
fmdbcnt_createContentAction.fileMixin.ui.tooltip=Optional. A mixin added to every stored file (for example <i>ctmdmix:credited</i>), to carry the file properties below.
fmdbcnt_createContentAction.fileProperties=File properties
fmdbcnt_createContentAction.fileProperties.ui.tooltip=One line per field: <i>formField=fileProperty</i>. The value of the field is written on every stored file (for example <i>credit=ctmdCredit</i>). The property must be declared by the file type or by the mixin above.
fmdbcnt_createContentAction.fixedValues=Fixed values
fmdbcnt_createContentAction.fixedValues.ui.tooltip=One line per value: <i>property=value</i> (for example <i>submissionStatus=submitted</i>). Repeat the line for a multiple property. A fixed value wins over a field mapped to the same property.
fmdbcnt_createContentAction.submitterProperty=Submitter property
fmdbcnt_createContentAction.submitterProperty.ui.tooltip=Optional. The property that receives the user name of the person who submitted.
fmdbcnt_createContentAction.organizationProperty=Organization property
fmdbcnt_createContentAction.organizationProperty.ui.tooltip=Optional. The property that receives the organization (j:organization) of the person who submitted.
fmdbcnt_createContentAction.pageProperty=Page property
fmdbcnt_createContentAction.pageProperty.ui.tooltip=Optional. The reference property that receives the page the form was submitted from. It is found from the address the browser reports and kept only when it is a page, or a content with its own page, of this site that the submitter can read; otherwise it stays empty.
fmdbcnt_createContentAction.requiredPairs=Required companion files
fmdbcnt_createContentAction.requiredPairs.ui.tooltip=One line per rule: <i>dependentField&lt;-field:mimePattern</i> (for example <i>captions&lt;-media:video/*</i>). When the field holds files whose detected type matches, the dependent field must hold at least as many files, or the submission is refused.
fmdbcnt_createContentAction.pairRefusalMessage=Message for a missing companion file
fmdbcnt_createContentAction.pairRefusalMessage.ui.tooltip=Optional. The sentence the visitor reads when a companion file is missing (for example: Every video needs its captions file). Empty: a generic sentence.
fmdbcnt_createContentAction.publish=Publish
fmdbcnt_createContentAction.publish.ui.tooltip=Publishes the created content and its files, in every language of the site, so that the submitter sees them at once. On by default.

# What the visitor reads (never says which folder, group or setting is behind it)
visitor.signInRequired=Please sign in to send this form.
visitor.noFolder=Your account is not set up to send content here. Please contact your administrator.
visitor.badValue=One of the values you entered is not valid. Check the form and try again.
visitor.pairRefusal=A file is missing: some of the files you sent need a companion file.
visitor.unavailable=This form is temporarily unavailable. Please try again later.
visitor.failed=We could not save your submission. Please try again later.
