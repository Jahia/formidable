# Formidable Content - libelles de l'editeur et phrases lues par le visiteur (francais).
# ASCII only, accents as \uXXXX escapes.

fmdbcnt_createContentAction=Cr\u00e9er un contenu
fmdbcnt_createContentAction.ui.tooltip=Cr\u00e9e un contenu \u00e0 partir de la soumission d'un utilisateur connect\u00e9 : les champs du formulaire remplissent les propri\u00e9t\u00e9s d'un n\u0153ud du type choisi, les fichiers envoy\u00e9s sont stock\u00e9s et r\u00e9f\u00e9renc\u00e9s par lui, puis le tout est publi\u00e9. Les visiteurs anonymes sont refus\u00e9s. Le contenu n'est \u00e9crit que dans un dossier que l'utilisateur peut lire, celui que d\u00e9signe son groupe.
fmdbcnt_createContentAction.contentType=Type de contenu
fmdbcnt_createContentAction.contentType.ui.tooltip=Le type de n\u0153ud \u00e0 cr\u00e9er, avec son pr\u00e9fixe (par exemple ctmd:submission). Il doit exister, ne pas \u00eatre abstrait et \u00eatre autoris\u00e9 dans le dossier cible.
fmdbcnt_createContentAction.parentFolder=Dossier des contenus
fmdbcnt_createContentAction.parentFolder.ui.tooltip=Le dossier dans lequel le contenu est cr\u00e9\u00e9. Avec un pr\u00e9fixe de groupe, c'est le dossier qui contient un sous-dossier par groupe. Il doit \u00eatre publi\u00e9 : l'action le lit dans l'espace de travail live.
fmdbcnt_createContentAction.filesFolder=Dossier des fichiers
fmdbcnt_createContentAction.filesFolder.ui.tooltip=Le dossier dans lequel les fichiers envoy\u00e9s sont stock\u00e9s. Avec un pr\u00e9fixe de groupe, il contient les m\u00eames sous-dossiers que le dossier des contenus. Obligatoire d\u00e8s qu'un champ d'envoi de fichiers est associ\u00e9.
fmdbcnt_createContentAction.groupPrefix=Pr\u00e9fixe de groupe
fmdbcnt_createContentAction.groupPrefix.ui.tooltip=Facultatif. S'il est renseign\u00e9, on cherche parmi les groupes de l'utilisateur celui dont le nom commence par ce pr\u00e9fixe ; le reste du nom est le sous-dossier du dossier des contenus et du dossier des fichiers (pr\u00e9fixe <i>orvane-supplier-</i> et groupe <i>orvane-supplier-northlight</i> donnent le sous-dossier <i>northlight</i>). Les sous-dossiers doivent d\u00e9j\u00e0 exister : ils ne sont jamais cr\u00e9\u00e9s. Aucun groupe correspondant, plusieurs, ou un sous-dossier absent font refuser la soumission.
fmdbcnt_createContentAction.titleField=Champ du titre
fmdbcnt_createContentAction.titleField.ui.tooltip=Le champ dont la valeur devient le titre du contenu (jcr:title), dans toutes les langues du site. Il donne aussi son nom au n\u0153ud.
fmdbcnt_createContentAction.fieldMappings=Correspondance des champs
fmdbcnt_createContentAction.fieldMappings.ui.tooltip=Une ligne par champ : <i>champ=propri\u00e9t\u00e9</i>. La valeur est convertie au type de la propri\u00e9t\u00e9 (texte, entier, d\u00e9cimal, vrai ou faux, date au format aaaa-mm-jj ; une propri\u00e9t\u00e9 multiple re\u00e7oit toutes les valeurs du champ). Une propri\u00e9t\u00e9 inconnue ou une valeur inadapt\u00e9e fait refuser la soumission.
fmdbcnt_createContentAction.fileMappings=Correspondance des fichiers
fmdbcnt_createContentAction.fileMappings.ui.tooltip=Une ligne par champ d'envoi : <i>champFichier=propri\u00e9t\u00e9</i>. Les fichiers sont stock\u00e9s dans le dossier des fichiers (noms uniques et nettoy\u00e9s ; la taille d'une image est enregistr\u00e9e) et la propri\u00e9t\u00e9, une r\u00e9f\u00e9rence vers des fichiers, les d\u00e9signe.
fmdbcnt_createContentAction.fileMixin=Mixin des fichiers
fmdbcnt_createContentAction.fileMixin.ui.tooltip=Facultatif. Un mixin ajout\u00e9 \u00e0 chaque fichier stock\u00e9 (par exemple <i>ctmdmix:credited</i>), pour porter les propri\u00e9t\u00e9s de fichier ci-dessous.
fmdbcnt_createContentAction.fileProperties=Propri\u00e9t\u00e9s des fichiers
fmdbcnt_createContentAction.fileProperties.ui.tooltip=Une ligne par champ : <i>champ=propri\u00e9t\u00e9Fichier</i>. La valeur du champ est \u00e9crite sur chaque fichier stock\u00e9 (par exemple <i>credit=ctmdCredit</i>). La propri\u00e9t\u00e9 doit \u00eatre d\u00e9clar\u00e9e par le type de fichier ou par le mixin ci-dessus.
fmdbcnt_createContentAction.fixedValues=Valeurs fixes
fmdbcnt_createContentAction.fixedValues.ui.tooltip=Une ligne par valeur : <i>propri\u00e9t\u00e9=valeur</i> (par exemple <i>submissionStatus=submitted</i>). R\u00e9p\u00e9tez la ligne pour une propri\u00e9t\u00e9 multiple. Une valeur fixe l'emporte sur un champ associ\u00e9 \u00e0 la m\u00eame propri\u00e9t\u00e9.
fmdbcnt_createContentAction.submitterProperty=Propri\u00e9t\u00e9 de l'auteur
fmdbcnt_createContentAction.submitterProperty.ui.tooltip=Facultatif. La propri\u00e9t\u00e9 qui re\u00e7oit le nom d'utilisateur de la personne qui a soumis le formulaire.
fmdbcnt_createContentAction.organizationProperty=Propri\u00e9t\u00e9 de l'organisation
fmdbcnt_createContentAction.organizationProperty.ui.tooltip=Facultatif. La propri\u00e9t\u00e9 qui re\u00e7oit l'organisation (j:organization) de la personne qui a soumis le formulaire.
fmdbcnt_createContentAction.pageProperty=Propri\u00e9t\u00e9 de la page
fmdbcnt_createContentAction.pageProperty.ui.tooltip=Facultatif. La propri\u00e9t\u00e9 de r\u00e9f\u00e9rence qui re\u00e7oit la page depuis laquelle le formulaire a \u00e9t\u00e9 soumis. Elle est retrouv\u00e9e \u00e0 partir de l'adresse indiqu\u00e9e par le navigateur et n'est conserv\u00e9e que s'il s'agit d'une page, ou d'un contenu ayant sa propre page, de ce site que l'utilisateur peut lire ; sinon elle reste vide.
fmdbcnt_createContentAction.requiredPairs=Fichiers compl\u00e9mentaires obligatoires
fmdbcnt_createContentAction.requiredPairs.ui.tooltip=Une ligne par r\u00e8gle : <i>champD\u00e9pendant&lt;-champ:typeMime</i> (par exemple <i>captions&lt;-media:video/*</i>). Quand le champ contient des fichiers dont le type d\u00e9tect\u00e9 correspond, le champ d\u00e9pendant doit en contenir au moins autant, sinon la soumission est refus\u00e9e.
fmdbcnt_createContentAction.pairRefusalMessage=Message en cas de fichier compl\u00e9mentaire manquant
fmdbcnt_createContentAction.pairRefusalMessage.ui.tooltip=Facultatif. La phrase lue par le visiteur quand un fichier compl\u00e9mentaire manque (par exemple : chaque vid\u00e9o a besoin de son fichier de sous-titres). Vide : une phrase g\u00e9n\u00e9rique.
fmdbcnt_createContentAction.publish=Publier
fmdbcnt_createContentAction.publish.ui.tooltip=Publie le contenu cr\u00e9\u00e9 et ses fichiers, dans toutes les langues du site, pour que l'utilisateur les voie aussit\u00f4t. Activ\u00e9 par d\u00e9faut.

# What the visitor reads (never says which folder, group or setting is behind it)
visitor.signInRequired=Veuillez vous connecter pour envoyer ce formulaire.
visitor.noFolder=Votre compte n'est pas configur\u00e9 pour envoyer du contenu ici. Veuillez contacter votre administrateur.
visitor.badValue=Une des valeurs saisies n'est pas valide. V\u00e9rifiez le formulaire et r\u00e9essayez.
visitor.pairRefusal=Un fichier manque : certains fichiers envoy\u00e9s ont besoin d'un fichier compl\u00e9mentaire.
visitor.unavailable=Ce formulaire est momentan\u00e9ment indisponible. Veuillez r\u00e9essayer plus tard.
visitor.failed=Votre envoi n'a pas pu \u00eatre enregistr\u00e9. Veuillez r\u00e9essayer plus tard.
