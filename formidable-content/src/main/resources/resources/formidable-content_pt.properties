# Formidable Content - etiquetas do editor e frases lidas pelo visitante (portugues europeu).
# ASCII only, accents as \uXXXX escapes.

fmdbcnt_createContentAction=Criar conte\u00fado
fmdbcnt_createContentAction.ui.tooltip=Cria um conte\u00fado a partir da submiss\u00e3o de um utilizador com sess\u00e3o iniciada: os campos do formul\u00e1rio preenchem as propriedades de um n\u00f3 do tipo escolhido, os ficheiros enviados s\u00e3o guardados e referenciados por ele, e tudo \u00e9 publicado. Os visitantes an\u00f3nimos s\u00e3o recusados. O conte\u00fado s\u00f3 \u00e9 escrito numa pasta que o utilizador pode ler, a indicada pelo seu grupo.
fmdbcnt_createContentAction.contentType=Tipo de conte\u00fado
fmdbcnt_createContentAction.contentType.ui.tooltip=O tipo de n\u00f3 a criar, com o seu prefixo (por exemplo ctmd:submission). Tem de existir, n\u00e3o ser abstrato e ser permitido na pasta de destino.
fmdbcnt_createContentAction.parentFolder=Pasta dos conte\u00fados
fmdbcnt_createContentAction.parentFolder.ui.tooltip=A pasta onde o conte\u00fado \u00e9 criado. Com um prefixo de grupo, \u00e9 a pasta que cont\u00e9m uma subpasta por grupo. Tem de estar publicada: a a\u00e7\u00e3o l\u00ea-a no espa\u00e7o de trabalho live.
fmdbcnt_createContentAction.filesFolder=Pasta dos ficheiros
fmdbcnt_createContentAction.filesFolder.ui.tooltip=A pasta onde os ficheiros enviados s\u00e3o guardados. Com um prefixo de grupo, cont\u00e9m as mesmas subpastas que a pasta dos conte\u00fados. Obrigat\u00f3ria assim que um campo de envio de ficheiros \u00e9 associado.
fmdbcnt_createContentAction.groupPrefix=Prefixo de grupo
fmdbcnt_createContentAction.groupPrefix.ui.tooltip=Opcional. Se definido, procura-se entre os grupos do utilizador aquele cujo nome come\u00e7a por este prefixo, e o resto do nome \u00e9 a subpasta da pasta dos conte\u00fados e da pasta dos ficheiros (prefixo <i>orvane-supplier-</i> e grupo <i>orvane-supplier-northlight</i> d\u00e3o a subpasta <i>northlight</i>). As subpastas t\u00eam de existir j\u00e1: nunca s\u00e3o criadas. Nenhum grupo correspondente, v\u00e1rios, ou uma subpasta em falta fazem recusar a submiss\u00e3o.
fmdbcnt_createContentAction.titleField=Campo do t\u00edtulo
fmdbcnt_createContentAction.titleField.ui.tooltip=O campo cujo valor passa a ser o t\u00edtulo do conte\u00fado (jcr:title), em todas as l\u00ednguas do site. D\u00e1 tamb\u00e9m o nome ao n\u00f3.
fmdbcnt_createContentAction.fieldMappings=Correspond\u00eancia dos campos
fmdbcnt_createContentAction.fieldMappings.ui.tooltip=Uma linha por campo: <i>campo=propriedade</i>. O valor \u00e9 convertido para o tipo da propriedade (texto, n\u00famero inteiro, decimal, verdadeiro ou falso, data como aaaa-mm-dd; uma propriedade m\u00faltipla recebe todos os valores do campo). Uma propriedade desconhecida ou um valor inadequado faz recusar a submiss\u00e3o.
fmdbcnt_createContentAction.fileMappings=Correspond\u00eancia dos ficheiros
fmdbcnt_createContentAction.fileMappings.ui.tooltip=Uma linha por campo de envio: <i>campoFicheiro=propriedade</i>. Os ficheiros s\u00e3o guardados na pasta dos ficheiros (nomes \u00fanicos e limpos; o tamanho de uma imagem \u00e9 registado) e a propriedade, uma refer\u00eancia para ficheiros, aponta para eles.
fmdbcnt_createContentAction.fileMixin=Mixin dos ficheiros
fmdbcnt_createContentAction.fileMixin.ui.tooltip=Opcional. Um mixin adicionado a cada ficheiro guardado (por exemplo <i>ctmdmix:credited</i>), para conter as propriedades de ficheiro abaixo.
fmdbcnt_createContentAction.fileProperties=Propriedades dos ficheiros
fmdbcnt_createContentAction.fileProperties.ui.tooltip=Uma linha por campo: <i>campo=propriedadeFicheiro</i>. O valor do campo \u00e9 escrito em cada ficheiro guardado (por exemplo <i>credit=ctmdCredit</i>). A propriedade tem de ser declarada pelo tipo de ficheiro ou pelo mixin acima.
fmdbcnt_createContentAction.fixedValues=Valores fixos
fmdbcnt_createContentAction.fixedValues.ui.tooltip=Uma linha por valor: <i>propriedade=valor</i> (por exemplo <i>submissionStatus=submitted</i>). Repita a linha para uma propriedade m\u00faltipla. Um valor fixo prevalece sobre um campo associado \u00e0 mesma propriedade.
fmdbcnt_createContentAction.submitterProperty=Propriedade do autor
fmdbcnt_createContentAction.submitterProperty.ui.tooltip=Opcional. A propriedade que recebe o nome de utilizador da pessoa que submeteu o formul\u00e1rio.
fmdbcnt_createContentAction.organizationProperty=Propriedade da organiza\u00e7\u00e3o
fmdbcnt_createContentAction.organizationProperty.ui.tooltip=Opcional. A propriedade que recebe a organiza\u00e7\u00e3o (j:organization) da pessoa que submeteu o formul\u00e1rio.
fmdbcnt_createContentAction.pageProperty=Propriedade da p\u00e1gina
fmdbcnt_createContentAction.pageProperty.ui.tooltip=Opcional. A propriedade de refer\u00eancia que recebe a p\u00e1gina a partir da qual o formul\u00e1rio foi submetido. \u00c9 encontrada a partir do endere\u00e7o indicado pelo navegador e s\u00f3 \u00e9 mantida se for uma p\u00e1gina, ou um conte\u00fado com p\u00e1gina pr\u00f3pria, deste site que o utilizador possa ler; caso contr\u00e1rio fica vazia.
fmdbcnt_createContentAction.requiredPairs=Ficheiros complementares obrigat\u00f3rios
fmdbcnt_createContentAction.requiredPairs.ui.tooltip=Uma linha por regra: <i>campoDependente&lt;-campo:tipoMime</i> (por exemplo <i>captions&lt;-media:video/*</i>). Quando o campo cont\u00e9m ficheiros cujo tipo detetado corresponde, o campo dependente tem de conter pelo menos tantos, caso contr\u00e1rio a submiss\u00e3o \u00e9 recusada.
fmdbcnt_createContentAction.pairRefusalMessage=Mensagem para ficheiro complementar em falta
fmdbcnt_createContentAction.pairRefusalMessage.ui.tooltip=Opcional. A frase lida pelo visitante quando falta um ficheiro complementar (por exemplo: cada v\u00eddeo precisa do seu ficheiro de legendas). Vazio: uma frase gen\u00e9rica.
fmdbcnt_createContentAction.publish=Publicar
fmdbcnt_createContentAction.publish.ui.tooltip=Publica o conte\u00fado criado e os seus ficheiros, em todas as l\u00ednguas do site, para que o utilizador os veja de imediato. Ativado por omiss\u00e3o.

# What the visitor reads (never says which folder, group or setting is behind it)
visitor.signInRequired=Inicie sess\u00e3o para enviar este formul\u00e1rio.
visitor.noFolder=A sua conta n\u00e3o est\u00e1 configurada para enviar conte\u00fado para aqui. Contacte o administrador.
visitor.badValue=Um dos valores introduzidos n\u00e3o \u00e9 v\u00e1lido. Verifique o formul\u00e1rio e tente novamente.
visitor.pairRefusal=Falta um ficheiro: alguns dos ficheiros enviados precisam de um ficheiro complementar.
visitor.unavailable=Este formul\u00e1rio est\u00e1 temporariamente indispon\u00edvel. Tente novamente mais tarde.
visitor.failed=N\u00e3o foi poss\u00edvel guardar o seu envio. Tente novamente mais tarde.
